<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Disciplines</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12132A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Disciplines">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12132A;
    --bg-2: #191B38;
    --surface: #1F2247;
    --surface-2: #262A57;
    --line: #33376B;
    --text: #F1EFE8;
    --text-dim: #9598C4;
    --coral: #FF6B4E;
    --coral-dim: #7A3B2C;
    --lime: #C7F464;
    --lime-dim: #4A5A2A;
    --violet: #9B8CFF;
    --font-head: 'Space Grotesk', system-ui, sans-serif;
    --font-body: 'Inter', system-ui, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html,
  body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-tap-highlight-color: transparent;
  }
  body {
    background:
      radial-gradient(circle at 15% 0%, rgba(155,140,255,0.16), transparent 45%),
      radial-gradient(circle at 90% 10%, rgba(255,107,78,0.14), transparent 40%),
      var(--bg);
    min-height: 100%;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 480px;
    padding: 22px 18px 40px;
    position: relative;
  }

  /* Header */
  .top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .top-title h1 {
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 26px;
    margin: 0 0 2px;
    letter-spacing: -0.01em;
  }
  .top-title p {
    margin: 0;
    color: var(--text-dim);
    font-size: 13.5px;
  }
  .streak {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 12px 7px 10px;
    flex-shrink: 0;
  }
  .streak b {
    font-family: var(--font-head);
    font-size: 15px;
  }
  .streak span.label {
    color: var(--text-dim);
    font-size: 11.5px;
  }

  /* Date navigator */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 16px;
  }
  .date-nav-btn {
    width: 34px;
    height: 34px;
    flex-shrink: 0;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text);
    font-size: 17px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .date-nav-btn:active { transform: scale(0.92); }
  .date-nav-btn:disabled { opacity: 0.25; cursor: default; }
  .date-nav-btn:disabled:active { transform: none; }
  .date-nav-label {
    flex: 1;
    text-align: center;
    background: none;
    border: none;
    color: var(--text);
    font-family: var(--font-head);
    font-weight: 600;
    font-size: 15px;
    cursor: default;
    padding: 6px 8px;
  }
  .date-nav-label.is-past {
    color: var(--violet);
    cursor: pointer;
    text-decoration: underline;
    text-decoration-color: rgba(155,140,255,0.4);
  }

  /* Progress ring row */
  .today-progress {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
    color: var(--text-dim);
    font-size: 13px;
  }
  .today-progress .bar {
    flex: 1;
    height: 6px;
    border-radius: 999px;
    background: var(--surface-2);
    overflow: hidden;
  }
  .today-progress .bar-fill {
    height: 100%;
    background: var(--coral);
    width: 0%;
    border-radius: 999px;
    transition: width .4s ease;
  }

  /* Add task */
  .add-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 12px;
    margin-bottom: 22px;
  }
  .task-xp-input {
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--text);
    font-family: var(--font-head);
    font-size: 15px;
    padding: 11px 8px;
    outline: none;
    text-align: center;
  }
  .task-xp-input:focus { border-color: var(--violet); }
  .add-btn-wide {
    width: 100%;
    margin-top: 10px;
    padding: 12px 0;
    border-radius: 12px;
    border: none;
    background: var(--coral);
    color: #1a0e0a;
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  .add-btn-wide:active { transform: scale(0.98); }

  /* Group creation form */
  .group-name-input {
    width: 100%;
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 15px;
    padding: 11px 13px;
    outline: none;
    margin-bottom: 12px;
  }
  .group-name-input::placeholder { color: var(--text-dim); }
  .group-name-input:focus { border-color: var(--violet); }
  .form-error {
    color: #FF8A8A;
    font-size: 12px;
    text-align: center;
    margin-top: 9px;
    display: none;
  }
  .form-error.show { display: block; }

  /* Calendar tier breakdown */
  .tier-count-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    margin-top: 10px;
  }
  .tier-count-chip {
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 11.5px;
    color: var(--text-dim);
  }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 4px;
    margin-bottom: 20px;
  }
  .tab-btn {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-family: var(--font-head);
    font-weight: 600;
    font-size: 13.5px;
    padding: 9px 0;
    border-radius: 10px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .tab-btn.active {
    background: var(--surface-2);
    color: var(--text);
  }

  /* Calendar */
  .cal-select-wrap {
    margin-bottom: 16px;
  }
  .cal-select {
    width: 100%;
    appearance: none;
    -webkit-appearance: none;
    background: var(--surface) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="12" height="8" viewBox="0 0 12 8"><path d="M1 1L6 6L11 1" stroke="%239598C4" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>') no-repeat right 14px center;
    border: 1px solid var(--line);
    border-radius: 14px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 15px;
    font-weight: 500;
    padding: 13px 38px 13px 15px;
    cursor: pointer;
  }
  .cal-select:focus { border-color: var(--violet); outline: none; }
  .cal-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 16px;
  }
  .cal-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .cal-nav span {
    font-family: var(--font-head);
    font-weight: 600;
    font-size: 15px;
  }
  .cal-nav button {
    width: 30px;
    height: 30px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: var(--bg-2);
    color: var(--text);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cal-nav button:active { transform: scale(0.92); }
  .cal-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    margin-bottom: 6px;
  }
  .cal-weekdays span {
    text-align: center;
    font-size: 11px;
    color: var(--text-dim);
    font-family: var(--font-head);
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .cal-day {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 9px;
    font-size: 12.5px;
    color: var(--text-dim);
    position: relative;
  }
  .cal-day.pad { visibility: hidden; }
  .cal-day.today { box-shadow: inset 0 0 0 1.5px var(--violet); }
  .cal-day.done {
    background: var(--lime);
    color: #12132A;
    font-weight: 700;
  }
  .cal-day:not(.pad):not(.future) {
    cursor: pointer;
    transition: transform .12s ease, background .15s ease;
  }
  .cal-day:not(.pad):not(.future):active { transform: scale(0.88); }
  .cal-day.future {
    opacity: 0.3;
  }
  .cal-summary .cal-hint {
    display: inline-block;
    margin-top: 6px;
    font-size: 11.5px;
    color: var(--text-dim);
    opacity: 0.8;
  }
  .cal-summary {
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    margin-top: 14px;
  }
  .cal-summary b {
    color: var(--lime);
    font-family: var(--font-head);
  }

  /* Drinks */
  .cal-day.has-drinks {
    background: var(--coral-dim);
    color: var(--text);
    font-weight: 700;
  }
  .cal-day.selected {
    outline: 2px solid var(--coral);
    outline-offset: -2px;
  }
  .cal-day-badge {
    position: absolute;
    bottom: 1px;
    right: 2px;
    font-size: 7.5px;
    font-family: var(--font-head);
    background: var(--coral);
    color: #1a0e0a;
    border-radius: 999px;
    padding: 0 3px;
    line-height: 1.3;
  }
  .drink-month-summary {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }
  .drink-stat {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 10px;
    text-align: center;
  }
  .drink-stat b {
    display: block;
    font-family: var(--font-head);
    font-size: 18px;
    color: var(--coral);
  }
  .drink-stat span {
    font-size: 10.5px;
    color: var(--text-dim);
  }
  .drink-day-panel {
    margin-top: 18px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 14px;
  }
  .drink-day-panel-title {
    font-family: var(--font-head);
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 10px;
  }
  .drink-entry-list {
    list-style: none;
    margin: 0 0 12px;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .drink-entry {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 9px 10px;
  }
  .drink-entry-text { flex: 1; font-size: 13.5px; min-width: 0; }
  .drink-entry-cost { font-family: var(--font-head); font-size: 12.5px; color: var(--coral); flex-shrink: 0; }
  .drink-del {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    border: none;
    background: none;
    color: var(--text-dim);
    font-size: 15px;
    cursor: pointer;
    opacity: 0.5;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .drink-del:active { opacity: 1; }
  .drink-add-row {
    display: flex;
    gap: 8px;
  }
  .drink-type-select {
    flex: 1;
    min-width: 0;
    appearance: none;
    -webkit-appearance: none;
    background: var(--bg-2) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="12" height="8" viewBox="0 0 12 8"><path d="M1 1L6 6L11 1" stroke="%239598C4" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>') no-repeat right 11px center;
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    padding: 11px 28px 11px 12px;
  }
  .drink-type-select:focus { border-color: var(--violet); outline: none; }
  .drink-qty-input { flex: 0 0 58px; min-width: 0; }
  .drink-cost-input { flex: 0 0 76px; min-width: 0; }
  .drink-other-input {
    margin-top: 8px;
    width: 100%;
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    padding: 10px 12px;
    outline: none;
  }
  .drink-other-input::placeholder { color: var(--text-dim); }
  .drink-other-input:focus { border-color: var(--violet); }

  .backup-btn-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .backup-btn {
    flex: 1;
    padding: 10px 8px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--bg-2);
    color: var(--text);
    font-family: var(--font-head);
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }
  .backup-btn:active { transform: scale(0.97); }
  .backup-btn.small { flex: 0 0 auto; padding: 6px 12px; font-size: 12px; }
  #restoreList { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .import-text {
    width: 100%;
    min-height: 70px;
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 13px;
    padding: 10px 12px;
    outline: none;
    resize: vertical;
  }
  .import-text:focus { border-color: var(--violet); }

  /* Sections */
  .section-label {
    font-family: var(--font-head);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-dim);
    margin: 4px 2px 10px;
  }
  .category-badge {
    font-size: 10.5px;
    color: var(--text-dim);
    background: var(--bg-2);
    border-radius: 999px;
    padding: 2px 8px;
  }

  .task-list {
    list-style: none;
    margin: 0 0 20px;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .task {
    display: flex;
    align-items: center;
    gap: 11px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 12px;
    position: relative;
    animation: rise .28s ease;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .task.done {
    opacity: 0.55;
    background: var(--bg-2);
  }

  .task-text {
    flex: 1;
    font-size: 15px;
    line-height: 1.35;
    min-width: 0;
    word-break: break-word;
  }
  .task.done .task-text {
    text-decoration: line-through;
    text-decoration-color: var(--text-dim);
    color: var(--text-dim);
  }
  .task-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .task-streak {
    font-family: var(--font-head);
    font-size: 11.5px;
    font-weight: 600;
    color: var(--coral);
    background: rgba(255,107,78,0.14);
    border-radius: 999px;
    padding: 2px 7px;
  }
  .task-del {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border: none;
    background: none;
    color: var(--text-dim);
    font-size: 16px;
    cursor: pointer;
    opacity: 0.5;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .task-del:active { opacity: 1; }
  .task-edit-btn {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    border: none;
    background: none;
    color: var(--violet);
    font-size: 14px;
    cursor: pointer;
    opacity: 0.75;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .task-edit-btn:active { opacity: 1; }
  .task.editing {
    align-items: stretch;
    padding: 12px;
  }
  .edit-wrap {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .edit-row {
    display: flex;
    gap: 8px;
    min-width: 0;
  }
  .edit-row .task-xp-input { flex: 0 0 72px; min-width: 0; }
  .edit-save-btn,
  .edit-cancel-btn {
    flex: 1;
    padding: 9px 0;
    border-radius: 10px;
    border: 1px solid var(--line);
    font-family: var(--font-head);
    font-weight: 600;
    font-size: 12.5px;
    cursor: pointer;
  }
  .edit-save-btn {
    background: var(--lime);
    color: #12132A;
    border: none;
  }
  .edit-cancel-btn {
    background: transparent;
    color: var(--text-dim);
  }

  .empty {
    text-align: center;
    padding: 34px 20px;
    color: var(--text-dim);
    font-size: 14px;
    background: var(--surface);
    border: 1px dashed var(--line);
    border-radius: 16px;
  }
  .empty .glyph { font-size: 26px; display: block; margin-bottom: 8px; }

  /* celebration overlay */
  .celebrate {
    position: fixed;
    inset: 0;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 60;
    opacity: 0;
  }
  .celebrate.show { animation: celebrateShow 2.2s ease forwards; }
  @keyframes celebrateShow {
    0% { opacity: 0; }
    10% { opacity: 1; }
    80% { opacity: 1; }
    100% { opacity: 0; }
  }
  .celebrate-card {
    background: var(--surface);
    border: 1px solid var(--violet);
    border-radius: 20px;
    padding: 22px 28px;
    text-align: center;
    box-shadow: 0 0 0 1px rgba(155,140,255,0.2), 0 20px 60px rgba(0,0,0,0.5);
    transform: scale(0.85);
  }
  .celebrate.show .celebrate-card { animation: pop .5s cubic-bezier(.34,1.56,.64,1) forwards; }
  @keyframes pop { to { transform: scale(1); } }
  .celebrate-card .big { font-size: 34px; display: block; margin-bottom: 6px; }
  .celebrate-card .title {
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 17px;
    margin-bottom: 3px;
  }
  .celebrate-card .sub { color: var(--text-dim); font-size: 13px; }
  .confetti-bit {
    position: absolute;
    width: 7px;
    height: 7px;
    top: 50%;
    left: 50%;
    border-radius: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  /* Disciplines list (v2) */
  .count-pill {
    display: flex;
    align-items: baseline;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 14px;
    flex-shrink: 0;
  }
  .count-pill b { font-family: var(--font-head); font-size: 15px; color: var(--lime); }
  .count-pill span { color: var(--text-dim); font-size: 11.5px; }
  .task { cursor: pointer; }
  .task.done { opacity: 0.8; }
  .done-btn {
    flex-shrink: 0;
    border: 1.5px solid var(--lime);
    background: transparent;
    color: var(--lime);
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 13px;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease, transform .12s ease;
  }
  .done-btn:active { transform: scale(0.94); }
  .task.done .done-btn { background: var(--lime); color: #12132A; }
  .cal-day.partial { background: var(--lime-dim); color: var(--text); font-weight: 700; }

  /* Day detail panel (calendar) */
  .day-panel {
    margin-top: 18px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 14px;
  }
  .day-panel-title { font-family: var(--font-head); font-weight: 600; font-size: 14.5px; }

<script>
(function(){
  var STORAGE_KEY = 'daily_disciplines_state_v1';
  var state = null;

  // phone cleared the app's storage). Until the cloud copy has been pulled, such
  // a device must never push its empty state up and overwrite real data.
  var localWasFresh = false;
  var cloudSynced = false;

  // ---- Firebase (optional cross-device sync) ----
  var firebaseConfig = {
    apiKey: "AIzaSyAq9_EmffcklWKSYl1k8dr-Hg1FrzMoihc",
    authDomain: "daily-disciplines-b7819.firebaseapp.com",

    appId: "1:796837430246:web:417eac9535c0905b4f8c27"
  };
  var SYNC_DOC = { collection: 'daily-disciplines', doc: 'my-data' };
  var db = null;
  var cloudReady = false;
  var suppressNextSnapshot = false;

  function initCloud() {
    try {
      if (typeof firebase === 'undefined') return; // SDK didn't load (offline, or blocked in this preview)
      if (!firebaseConfig.apiKey || firebaseConfig.apiKey.indexOf('YOUR_') === 0) return; // not configured yet
      firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
      try { db.enablePersistence({ synchronizeTabs: true }); } catch (e) { /* fine without it */ }
      cloudReady = true;
    } catch (e) {
      cloudReady = false;
    }
  }

  function startCloudSync() {
    if (!cloudReady || !db) return;
    var ref = db.collection(SYNC_DOC.collection).doc(SYNC_DOC.doc);
    ref.get().then(function(snap){
      if (snap.exists) {
        applyRemoteState(snap.data());
      } else {
        ref.set(state).catch(function(){});
      }
      cloudSynced = true;
      localWasFresh = false;
      maybeCloudBackup();
      ref.onSnapshot(function(snap2){
        if (suppressNextSnapshot) { suppressNextSnapshot = false; return; }
        if (snap2.exists) applyRemoteState(snap2.data());
      });
    }).catch(function(){ /* offline — local storage keeps the app working */ });
  }

  // Brings any saved data (including older versions that had XP, tiers and
  // counters) into the current shape: every discipline is simply done / not done
  // on each date.
  function migrateState(parsed) {
    parsed.tasks.forEach(function(t){
      // history[date] is `true` (done) or, for disciplines that track an amount,
      // a positive number (e.g. 40 pushups).
      var h = {};
      if (t.history && typeof t.history === 'object') {
        Object.keys(t.history).forEach(function(k){
          var v = t.history[k];
          if (typeof v === 'number' && v > 0) h[k] = v;
          else if (v) h[k] = true;
        });
      }
      t.history = h;
      if (t.type === 'counter' && typeof t.track !== 'boolean') t.track = true; // old counters keep their amounts
      t.type = 'simple';
      if (typeof t.track !== 'boolean') t.track = false;
      if (typeof t.unit !== 'string') t.unit = '';
      if (typeof t.text !== 'string') t.text = '';
      if (typeof t.category !== 'string') t.category = '';
    });
    if (!parsed.drinks || typeof parsed.drinks !== 'object') parsed.drinks = {};
    if (typeof parsed.updatedAt !== 'number') parsed.updatedAt = Date.now();
    return parsed;
  }

  function applyRemoteState(remote) {
    if (!remote || !Array.isArray(remote.tasks)) return;

    // A device that started with no local data always takes the cloud copy,
    // however "new" its own empty timestamp looks.
    var forcePull = localWasFresh && !cloudSynced;

    // If our local copy is newer than what the cloud has, don't lose it —
    // push it up instead of pulling the older remote copy down.
    if (!forcePull && state && typeof state.updatedAt === 'number' && typeof remote.updatedAt === 'number'
        && remote.updatedAt < state.updatedAt) {
      save();
      return;
    }

    // Safety net either way: keep the last few states we're about to replace,
    // so a bad sync is recoverable rather than silently gone.
    backupLocalState(state);

    state = migrateState(remote);
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    refreshAllViews();
  }

  var BACKUP_KEY = 'daily_disciplines_backups_v1';
  function backupLocalState(prevState) {
    try {
      if (!prevState || !Array.isArray(prevState.tasks) || prevState.tasks.length === 0) return;
      var raw = localStorage.getItem(BACKUP_KEY);
      var backups = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(backups)) backups = [];
      backups.unshift({ savedAt: Date.now(), state: prevState });
      backups = backups.slice(0, 5);
      localStorage.setItem(BACKUP_KEY, JSON.stringify(backups));
    } catch (e) { /* backups are best-effort, never block on them */ }
  }

  // Once a day, store a dated snapshot in the cloud (kept 30 days) so a bad
  // overwrite can always be rolled back from the Add tab → Backup & restore.
  var BACKUP_DOC_PREFIX = 'backup-';
  var LAST_CLOUD_BACKUP_KEY = 'daily_disciplines_last_cloud_backup';
  function maybeCloudBackup() {
    try {
      if (!cloudReady || !db || !cloudSynced) return;
      if (!state || !Array.isArray(state.tasks) || state.tasks.length === 0) return;
      var today = todayStr();
      if (localStorage.getItem(LAST_CLOUD_BACKUP_KEY) === today) return;
      var col = db.collection(SYNC_DOC.collection);
      col.doc(BACKUP_DOC_PREFIX + today).set(state).then(function(){
        try { localStorage.setItem(LAST_CLOUD_BACKUP_KEY, today); } catch (e) {}
      }).catch(function(){});
      var old = new Date(); old.setDate(old.getDate() - 30);
      col.doc(BACKUP_DOC_PREFIX + todayStr(old)).delete().catch(function(){});
    } catch (e) { /* best effort */ }
  }

  function todayStr(d) {
    d = d || new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  function dateFromKey(key) {
    var p = key.split('-');
    return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
  }

  function defaultState() {
    return {
      tasks: [],           // {id, text, category, createdDate, history: {date: true}}
      drinks: {},          // date -> [{id, type, label, qty, cost}]
      celebratedDate: '',  // the day the "all done" celebration last played
      updatedAt: Date.now()
    };
  }

  function load() {
    var raw = null;
    try {
      raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) { localWasFresh = true; return defaultState(); }
      var parsed = JSON.parse(raw);
      if (!parsed || !Array.isArray(parsed.tasks)) { localWasFresh = true; return defaultState(); }
      return migrateState(parsed);
    } catch (e) {
      // Unreadable save: keep the raw text aside instead of silently overwriting it.
      try { if (raw) localStorage.setItem('daily_disciplines_corrupt_raw', raw); } catch (e2) {}
      localWasFresh = true;
      return defaultState();
    }
  }

  function save() {
    state.updatedAt = Date.now();
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch (e) { /* storage unavailable — continue in-memory */ }
    // Never push from a device that started empty until it has pulled the cloud copy.
    if (cloudReady && db && !(localWasFresh && !cloudSynced)) {
      suppressNextSnapshot = true;
      db.collection(SYNC_DOC.collection).doc(SYNC_DOC.doc).set(state)
        .catch(function(){ /* offline — Firestore queues and retries automatically */ });
    }
  }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function escapeHtml(str) {
    var d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // ---- Discipline helpers ----
  function isDoneOn(t, dateKey) {
    return !!(t.history && t.history[dateKey]);
  }

  // A discipline only "counts" on a day if it already existed then (or was
  // ticked that day) — so a new discipline doesn't show as missed for the past.
  function activeOn(t, dateKey) {
    return isDoneOn(t, dateKey) || !t.createdDate || dateKey >= t.createdDate;
  }

  function computeStreak(task) {
    var history = task.history || {};
    var d = new Date();
    var streak = 0;
    if (history[todayStr(d)]) streak = 1;
    d.setDate(d.getDate() - 1);
    while (history[todayStr(d)]) {
      streak++;
      d.setDate(d.getDate() - 1);
    }
    return streak;
  }

  function setDone(t, dateKey, done) {
    if (!t.history) t.history = {};
    if (done) t.history[dateKey] = true; else delete t.history[dateKey];
  }

  // For disciplines that track an amount: a positive number means done that day.
  function amountOn(t, dateKey) {
    var v = t.history && t.history[dateKey];
    return typeof v === 'number' ? v : 0;
  }

  function setAmount(t, dateKey, n) {
    if (!t.history) t.history = {};
    if (n > 0) t.history[dateKey] = n; else delete t.history[dateKey];
  }

  function parseAmount(str) {
    var n = parseFloat(String(str).replace(',', '.'));
    if (isNaN(n) || n <= 0) return 0;
    return Math.round(n * 100) / 100;
  }

  function fmtAmount(n) {
    return (Math.round(n * 100) / 100).toLocaleString(undefined, { maximumFractionDigits: 2 });
  }

  // Builds the "[ number ] unit [Log]" control used on the Today tab and the calendar.
  // onSave(amount) is called with 0 to clear the day.
  function buildAmountControl(t, dateKey, onSave) {
    var wrap = document.createElement('div');
    wrap.className = 'amount-row';
    wrap.addEventListener('click', function(e){ e.stopPropagation(); });

    var input = document.createElement('input');
    input.type = 'number';
    input.inputMode = 'decimal';
    input.min = '0';
    input.step = 'any';
    input.className = 'amount-input';
    input.placeholder = '0';
    var cur = amountOn(t, dateKey);
    input.value = cur > 0 ? cur : '';

    var unit = document.createElement('span');
    unit.className = 'amount-unit';
    unit.textContent = t.unit || '';

    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'done-btn';
    var logged = isDoneOn(t, dateKey);
    btn.textContent = logged ? '✓ Saved' : 'Log';

    function commit() { onSave(parseAmount(input.value)); }
    btn.addEventListener('click', commit);
    input.addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); commit(); } });
    input.addEventListener('change', commit);

    wrap.appendChild(input);
    wrap.appendChild(unit);
    wrap.appendChild(btn);
    return wrap;
  }

  initCloud();

  // ---- DOM refs ----
  var dateLabel = document.getElementById('dateLabel');
  var headerDone = document.getElementById('headerDone');
  var progressLabel = document.getElementById('progressLabel');

  var tabDrinksBtn = document.getElementById('tabDrinksBtn');
  var todayView = document.getElementById('todayView');
  var addView = document.getElementById('addView');
  var calendarView = document.getElementById('calendarView');
  var drinksView = document.getElementById('drinksView');
  var calTaskSelect = document.getElementById('calTaskSelect');
  var calGrid = document.getElementById('calGrid');
  var calMonthLabel = document.getElementById('calMonthLabel');
  var calSummary = document.getElementById('calSummary');
  var calPrev = document.getElementById('calPrev');
  var calNext = document.getElementById('calNext');

  var calDayTitle = document.getElementById('calDayTitle');
  var calDaySub = document.getElementById('calDaySub');

  var drinkCalGrid = document.getElementById('drinkCalGrid');
  var drinkCalMonthLabel = document.getElementById('drinkCalMonthLabel');
  var drinkCalPrev = document.getElementById('drinkCalPrev');

  var now = new Date();
  var viewedDate = todayStr();

  var calState = { year: now.getFullYear(), month: now.getMonth(), taskId: '', selectedDate: todayStr() };
  var drinkCalState = { year: now.getFullYear(), month: now.getMonth(), selectedDate: todayStr() };

    Object.keys(TABS).forEach(function(key){
      var active = key === tab;
      TABS[key].btn.classList.toggle('active', active);
      TABS[key].view.style.display = active ? '' : 'none';
    });
    if (tab === 'today') render();
    if (tab === 'add') renderManageList();
    if (tab === 'calendar') renderCalendar();
    if (tab === 'drinks') renderDrinksTab();
  }

  function refreshAllViews() {
    render();
    renderManageList();
    renderCalendar();
    renderDrinksTab();
  }

  // If the app stays open past midnight, roll the view over to the new day.
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState !== 'visible') return;
    var t = todayStr();
    if (t === lastSeenToday) return;
    if (viewedDate === lastSeenToday) viewedDate = t;
    lastSeenToday = t;
    refreshAllViews();
  });

  // ---- Categories ----
  function allCategories() {
    var cats = {};
    state.tasks.forEach(function(t){ if (t.category) cats[t.category] = true; });
    return Object.keys(cats).sort(function(a, b){ return a.toLowerCase() < b.toLowerCase() ? -1 : 1; });
  }

  function refreshCategoryOptions() {
    var cats = allCategories();
    categoryOptionsList.innerHTML = '';
    cats.forEach(function(c){
      var opt = document.createElement('option');
      opt.value = c;
      categoryOptionsList.appendChild(opt);
    });
    if (todayCategory && cats.indexOf(todayCategory) === -1) todayCategory = '';
    todayCategoryWrap.style.display = cats.length ? '' : 'none';
    todayCategorySelect.innerHTML = '';
    var allOpt = document.createElement('option');
    allOpt.value = '';
    allOpt.textContent = 'All categories';
    todayCategorySelect.appendChild(allOpt);
    cats.forEach(function(c){
      var o = document.createElement('option');
      o.value = c;
      o.textContent = c;
      if (c === todayCategory) o.selected = true;
      todayCategorySelect.appendChild(o);
    });
  }

  todayCategorySelect.addEventListener('change', function(){
    todayCategory = todayCategorySelect.value;
    render();
  });

  // ---- Today tab ----
  function changeDay(delta) {
    var d = dateFromKey(viewedDate);
    d.setDate(d.getDate() + delta);
    var newKey = todayStr(d);
    if (newKey > todayStr()) return; // no browsing into the future
    viewedDate = newKey;
    render();
  }
  datePrevBtn.addEventListener('click', function(){ changeDay(-1); });
  dateNextBtn.addEventListener('click', function(){ changeDay(1); });
  dateNavLabel.addEventListener('click', function(){
    if (viewedDate !== todayStr()) { viewedDate = todayStr(); render(); }
  });

  function render() {
    var today = todayStr();
    var isToday = viewedDate === today;
    dateLabel.textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
    dateNavLabel.textContent = isToday ? 'Today' : dateFromKey(viewedDate).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
    dateNavLabel.classList.toggle('is-past', !isToday);
    dateNextBtn.disabled = isToday;

    refreshCategoryOptions();

    var todays = state.tasks.filter(function(t){ return activeOn(t, today); });
    var todayDone = todays.filter(function(t){ return isDoneOn(t, today); }).length;
    headerDone.textContent = todayDone + '/' + todays.length;

    var visible = state.tasks.filter(function(t){ return activeOn(t, viewedDate); });
    var doneN = visible.filter(function(t){ return isDoneOn(t, viewedDate); }).length;
    progressLabel.textContent = visible.length ? (doneN + ' of ' + visible.length + ' done') : 'Nothing to do yet';
    todayFill.style.width = visible.length ? ((doneN / visible.length) * 100) + '%' : '0%';

    var shown = todayCategory ? visible.filter(function(t){ return t.category === todayCategory; }) : visible;

    listsWrap.innerHTML = '';
    if (state.tasks.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.innerHTML = '<span class="glyph">✨</span>No disciplines yet.<br>Add your first one in the Add tab.';
      listsWrap.appendChild(empty);
      return;
    }
    if (shown.length === 0) {
      var none = document.createElement('div');
      none.className = 'empty';
      none.textContent = 'Nothing to show for this category.';
      listsWrap.appendChild(none);
      return;
    }
    var ul = document.createElement('ul');
    ul.className = 'task-list';
    shown.forEach(function(t){
      var done = isDoneOn(t, viewedDate);
      var li = document.createElement('li');
      li.className = 'task' + (done ? ' done' : '');

      var text = document.createElement('div');
      text.className = 'task-text';
      text.textContent = t.text;

      var meta = document.createElement('div');
      meta.className = 'task-meta';
      var streak = computeStreak(t);
      meta.innerHTML = (t.category ? '<span class="category-badge">' + escapeHtml(t.category) + '</span>' : '') +
        (streak > 0 ? '<span class="task-streak">🔥' + streak + '</span>' : '');

      li.appendChild(text);
      li.appendChild(meta);

      if (t.track) {
        // Amount-tracked discipline: type how many, then Log it.
        li.className += ' tracked';
        li.style.cursor = 'default';
        li.appendChild(buildAmountControl(t, viewedDate, function(n){
          setAmount(t, viewedDate, n);
          save();
          render();
          if (n > 0 && viewedDate === todayStr()) maybeCelebrate();
        }));
      } else {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'done-btn';
        btn.textContent = done ? '✓ Done' : 'Done';
        li.appendChild(btn);
        li.addEventListener('click', function(){ onToggle(t.id); });
      }
      ul.appendChild(li);
    });
    listsWrap.appendChild(ul);
  }

  function onToggle(id) {
    var t = state.tasks.find(function(x){ return x.id === id; });
    if (!t) return;
    var nowDone = !isDoneOn(t, viewedDate);
    setDone(t, viewedDate, nowDone);
    save();
    render();
    if (nowDone && viewedDate === todayStr()) maybeCelebrate();
  }

  function maybeCelebrate() {
    var today = todayStr();
    var todays = state.tasks.filter(function(t){ return activeOn(t, today); });
    if (todays.length === 0 || state.celebratedDate === today) return;
    var allDone = todays.every(function(t){ return isDoneOn(t, today); });
    if (!allDone) return;
    state.celebratedDate = today;
    save();
    launchCelebration();
  }

  function launchCelebration() {
    var colors = ['#FF6B4E', '#C7F464', '#9B8CFF', '#F1EFE8'];
    var old = celebrate.querySelectorAll('.confetti-bit');
    old.forEach(function(o){ o.remove(); });
    for (var i = 0; i < 26; i++) {
      var bit = document.createElement('div');
      bit.className = 'confetti-bit';
      var angle = Math.random() * Math.PI * 2;
      var dist = 90 + Math.random() * 140;
      var dx = Math.cos(angle) * dist;
      var dy = Math.sin(angle) * dist - 40;
      bit.style.background = colors[i % colors.length];
      bit.style.animation = 'none';
      bit.animate([
        { transform: 'translate(-50%,-50%) rotate(0deg)', opacity: 1 },
        { transform: 'translate(' + dx + 'px,' + dy + 'px) rotate(' + (Math.random()*400-200) + 'deg)', opacity: 0 }
      ], { duration: 1000 + Math.random()*500, easing: 'cubic-bezier(.2,.8,.3,1)', fill: 'forwards' });
      celebrate.appendChild(bit);
    }
    celebrate.classList.remove('show');
    void celebrate.offsetWidth;
    celebrate.classList.add('show');
  }

  // ---- Add tab ----
  function addTask() {
    taskFormError.classList.remove('show');
    var text = taskInput.value.trim();
    if (!text) {
      taskFormError.textContent = 'Give it a name first.';
      taskFormError.classList.add('show');
      taskInput.focus();
      return;
    }
    state.tasks.push({
      id: uid(), type: 'simple', text: text,
      category: taskCategoryInput.value.trim(),
      track: taskTrackCheck.checked,
      unit: taskTrackCheck.checked ? taskUnitInput.value.trim() : '',
      createdDate: todayStr(), history: {}
    });
    taskInput.value = '';
    taskCategoryInput.value = '';
    taskTrackCheck.checked = false;
    taskUnitInput.value = '';
    taskUnitInput.style.display = 'none';
    save();
    render();
    renderManageList();
    taskInput.focus();
  }
  addBtn.addEventListener('click', addTask);
  taskTrackCheck.addEventListener('change', function(){
    taskUnitInput.style.display = taskTrackCheck.checked ? '' : 'none';
    if (taskTrackCheck.checked) taskUnitInput.focus();
  });
  taskInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') addTask(); });
  taskCategoryInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') addTask(); });

  function onDelete(id) {
    var t = state.tasks.find(function(x){ return x.id === id; });
    if (!t) return;
    if (!window.confirm('Delete "' + t.text + '" and its history? This can\'t be undone.')) return;
    state.tasks = state.tasks.filter(function(x){ return x.id !== id; });
    save();
    render();
    renderManageList();
  }

  function renderManageList() {
    refreshCategoryOptions();
    manageListWrap.innerHTML = '';
    if (state.tasks.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.innerHTML = '<span class="glyph">✏️</span>Nothing added yet.<br>Use the form above to create your first discipline.';
      manageListWrap.appendChild(empty);
      return;
    }
    var ul = document.createElement('ul');
    ul.className = 'task-list';
    state.tasks.forEach(function(t){
      var li = document.createElement('li');

      if (editingTaskId === t.id) {
        li.className = 'task editing';
        li.style.cursor = 'default';
        var wrap = document.createElement('div');
        wrap.className = 'edit-wrap';

        var nameInput = document.createElement('input');
        nameInput.type = 'text';
        nameInput.className = 'group-name-input';
        nameInput.maxLength = 80;
        nameInput.value = t.text;

        var catInput = document.createElement('input');
        catInput.type = 'text';
        catInput.className = 'group-name-input';
        catInput.setAttribute('list', 'categoryOptions');
        catInput.placeholder = 'Category (optional)';
        catInput.maxLength = 30;
        catInput.value = t.category || '';

        var trackLabel = document.createElement('label');
        trackLabel.className = 'track-row';
        var trackCheck = document.createElement('input');
        trackCheck.type = 'checkbox';
        trackCheck.checked = !!t.track;
        var trackText = document.createElement('span');
        trackText.textContent = 'Track an amount (reps, km…)';
        trackLabel.appendChild(trackCheck);
        trackLabel.appendChild(trackText);

        var unitInput = document.createElement('input');
        unitInput.type = 'text';
        unitInput.className = 'group-name-input';
        unitInput.placeholder = 'Unit (e.g. reps, km)';
        unitInput.maxLength = 16;
        unitInput.value = t.unit || '';
        unitInput.style.display = t.track ? '' : 'none';
        trackCheck.addEventListener('change', function(){
          unitInput.style.display = trackCheck.checked ? '' : 'none';
        });

        var btnRow = document.createElement('div');
        btnRow.className = 'edit-row';
        var saveBtn = document.createElement('button');
        saveBtn.type = 'button';
        saveBtn.className = 'edit-save-btn';
        saveBtn.textContent = 'Save';
        var cancelBtn = document.createElement('button');
        cancelBtn.type = 'button';
        cancelBtn.className = 'edit-cancel-btn';
        cancelBtn.textContent = 'Cancel';
        saveBtn.addEventListener('click', function(){
          var newName = nameInput.value.trim();
          if (!newName) return;
          t.text = newName;
          t.category = catInput.value.trim();
          t.track = trackCheck.checked;
          t.unit = t.track ? unitInput.value.trim() : '';
          editingTaskId = null;
          save(); render(); renderManageList();
        });
        cancelBtn.addEventListener('click', function(){ editingTaskId = null; renderManageList(); });
        btnRow.appendChild(saveBtn);
        btnRow.appendChild(cancelBtn);

        wrap.appendChild(nameInput);
        wrap.appendChild(catInput);
        wrap.appendChild(trackLabel);
        wrap.appendChild(unitInput);
        wrap.appendChild(btnRow);
        li.appendChild(wrap);
        ul.appendChild(li);
        return;
      }

      li.className = 'task';
      li.style.cursor = 'default';
      var text = document.createElement('div');
      text.className = 'task-text';
      text.textContent = t.text;

      var meta = document.createElement('div');
      meta.className = 'task-meta';
      var streak = computeStreak(t);
      meta.innerHTML = (t.category ? '<span class="category-badge">' + escapeHtml(t.category) + '</span>' : '') +
        (t.track ? '<span class="category-badge">' + escapeHtml(t.unit || 'amount') + '</span>' : '') +
        (streak > 0 ? '<span class="task-streak">🔥' + streak + '</span>' : '');

      var editBtn = document.createElement('button');
      editBtn.className = 'task-edit-btn';
      editBtn.setAttribute('aria-label', 'Edit discipline');
      editBtn.textContent = '✎';
      editBtn.addEventListener('click', function(){ editingTaskId = t.id; renderManageList(); });

      var del = document.createElement('button');
      del.className = 'task-del';
      del.setAttribute('aria-label', 'Delete discipline');
      del.textContent = '×';
      del.addEventListener('click', function(){ onDelete(t.id); });

      li.appendChild(text);
      li.appendChild(meta);
      li.appendChild(editBtn);
      li.appendChild(del);
      ul.appendChild(li);
    });
    manageListWrap.appendChild(ul);
  }

  // ---- Calendar tab ----
  calPrev.addEventListener('click', function(){ changeMonth(-1); });
  calNext.addEventListener('click', function(){ changeMonth(1); });
  calTaskSelect.addEventListener('change', function(){
    calState.taskId = calTaskSelect.value;
    renderCalendar();
  });

  function changeMonth(delta) {
    calState.month += delta;
    if (calState.month < 0) { calState.month = 11; calState.year -= 1; }
    if (calState.month > 11) { calState.month = 0; calState.year += 1; }
    renderCalendar();
  }

  function renderCalendar() {
    if (calState.taskId && !state.tasks.some(function(t){ return t.id === calState.taskId; })) calState.taskId = '';

    calTaskSelect.innerHTML = '';
    var allOpt = document.createElement('option');
    allOpt.value = '';
    allOpt.textContent = 'All disciplines';
    calTaskSelect.appendChild(allOpt);
    state.tasks.forEach(function(t){
      var opt = document.createElement('option');
      opt.value = t.id;
      opt.textContent = t.text;
      if (t.id === calState.taskId) opt.selected = true;
      calTaskSelect.appendChild(opt);
    });

    var task = calState.taskId ? state.tasks.find(function(t){ return t.id === calState.taskId; }) : null;
    var monthDate = new Date(calState.year, calState.month, 1);
    calMonthLabel.textContent = monthDate.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });

    var firstWeekday = (monthDate.getDay() + 6) % 7; // weeks start on Monday
    var daysInMonth = new Date(calState.year, calState.month + 1, 0).getDate();
    var todayKey = todayStr();

    calGrid.innerHTML = '';
    for (var p = 0; p < firstWeekday; p++) {
      var pad = document.createElement('div');
      pad.className = 'cal-day pad';
      calGrid.appendChild(pad);
    }

    var tracked = !!(task && task.track);
    var monthCompletions = 0;
    var monthTotal = 0;
    var daysLogged = 0;
    var bestDay = 0;
    var dailyAmounts = [];

    function shortNum(n) {
      if (n >= 10000) return Math.round(n / 1000) + 'k';
      if (n >= 1000) return (Math.round(n / 100) / 10) + 'k';
      return fmtAmount(n);
    }

    for (var day = 1; day <= daysInMonth; day++) {
      var dKey = calState.year + '-' + String(calState.month + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
      var isFuture = dKey > todayKey;
      var cell = document.createElement('div');
      var cls = 'cal-day';
      var badgeText = '';

      if (task) {
        var done = isDoneOn(task, dKey);
        if (done) { cls += ' done'; monthCompletions++; }
        if (tracked) {
          var amt = amountOn(task, dKey);
          dailyAmounts.push(amt);
          if (amt > 0) { monthTotal += amt; daysLogged++; if (amt > bestDay) bestDay = amt; badgeText = shortNum(amt); }
          if (dKey === calState.selectedDate) cls += ' selected';
        }
      } else {
        var active = state.tasks.filter(function(t){ return activeOn(t, dKey); });
        var doneCount = active.filter(function(t){ return isDoneOn(t, dKey); }).length;
        monthCompletions += doneCount;
        if (doneCount > 0) badgeText = String(doneCount);
        if (active.length > 0 && doneCount === active.length) cls += ' done';
        else if (doneCount > 0) cls += ' partial';
        if (dKey === calState.selectedDate) cls += ' selected';
      }
      if (dKey === todayKey) cls += ' today';
      if (isFuture) cls += ' future';
      cell.className = cls;
      cell.textContent = day;
      if (badgeText) {
        var badge = document.createElement('span');
        badge.className = 'cal-day-badge';
        badge.textContent = badgeText;
        cell.appendChild(badge);
      }
      if (!isFuture) {
        cell.addEventListener('click', function(key){
          return function(){
            if (task && !tracked) {
              setDone(task, key, !isDoneOn(task, key));
              save();
              render();
            } else {
              calState.selectedDate = key;
            }
            renderCalendar();
          };
        }(dKey));
      }
      calGrid.appendChild(cell);
    }

    if (task && tracked) {
      var unitTxt = task.unit ? ' ' + escapeHtml(task.unit) : '';
      var maxAmt = Math.max.apply(null, dailyAmounts.concat([0]));
      var bars = '<div class="amount-bars">' + dailyAmounts.map(function(a, idx){
        var h = a > 0 ? Math.max(6, Math.round(a / maxAmt * 100)) : 0;
        var isTodayCol = (calState.year + '-' + String(calState.month + 1).padStart(2, '0') + '-' + String(idx + 1).padStart(2, '0')) === todayKey;
        return '<div class="amount-bar-col' + (isTodayCol ? ' today' : '') + '"><div class="amount-bar" style="height:' + h + '%"></div></div>';
      }).join('') + '</div><div class="amount-bars-axis"><span>1</span><span>' + daysInMonth + '</span></div>';
      calSummary.innerHTML =
        '<div class="drink-month-summary">' +
          '<div class="drink-stat"><b>' + fmtAmount(monthTotal) + '</b><span>total' + unitTxt + ' this month</span></div>' +
          '<div class="drink-stat"><b>' + daysLogged + '</b><span>day' + (daysLogged === 1 ? '' : 's') + ' logged</span></div>' +
        '</div>' +
        '<div class="drink-month-summary">' +
          '<div class="drink-stat"><b>' + (daysLogged ? fmtAmount(monthTotal / daysLogged) : '0') + '</b><span>average per day logged</span></div>' +
          '<div class="drink-stat"><b>' + fmtAmount(bestDay) + '</b><span>best day</span></div>' +
        '</div>' +
        bars +
        '<div class="cal-hint-line">🔥 ' + computeStreak(task) + '-day streak · tap a day to edit its amount</div>';
      calDayPanel.style.display = '';
      renderDayPanel();
    } else if (task) {
      var streak = computeStreak(task);
      calSummary.innerHTML = '<b>' + monthCompletions + '</b> time' + (monthCompletions === 1 ? '' : 's') +
        ' this month · 🔥 ' + streak + '-day streak' +
        '<br><span class="cal-hint">Tap any day to mark it done or undone.</span>';
      calDayPanel.style.display = 'none';
    } else {
      calSummary.innerHTML = state.tasks.length === 0
        ? 'Add a discipline in the Add tab to start tracking it here.'
        : '<b>' + monthCompletions + '</b> completion' + (monthCompletions === 1 ? '' : 's') + ' this month' +
          '<br><span class="cal-hint">Tap a day to see what you completed.</span>';
      calDayPanel.style.display = '';
      renderDayPanel();
    }
  }

  function renderDayPanel() {
    var dKey = calState.selectedDate;
    var singleTask = calState.taskId ? state.tasks.find(function(t){ return t.id === calState.taskId; }) : null;
    var active = singleTask ? [singleTask] : state.tasks.filter(function(t){ return activeOn(t, dKey); });
    var doneList = active.filter(function(t){ return isDoneOn(t, dKey); });
    var notDone = active.filter(function(t){ return !isDoneOn(t, dKey); });

    calDayTitle.textContent = (dKey === todayStr() ? 'Today — ' : '') +
      dateFromKey(dKey).toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'short' });
    if (singleTask) {
      var a = amountOn(singleTask, dKey);
      calDaySub.textContent = a > 0 ? 'Logged ' + fmtAmount(a) + (singleTask.unit ? ' ' + singleTask.unit : '') : 'Nothing logged yet';
    } else {
      calDaySub.textContent = active.length
        ? doneList.length + ' of ' + active.length + ' disciplines completed'
        : 'No disciplines yet';
    }

    calDayList.innerHTML = '';
    function addGroup(label, list, done) {
      if (!list.length) return;
      if (label) {
        var lab = document.createElement('div');
        lab.className = 'day-group-label';
        lab.textContent = label;
        calDayList.appendChild(lab);
      }
      list.forEach(function(t){
        var row = document.createElement('div');
        row.className = 'day-row' + (done ? ' done' : '') + (t.track ? ' tracked' : '');
        var mark = document.createElement('span');
        mark.className = 'mark';
        mark.textContent = done ? '✓' : '';
        var name = document.createElement('span');
        name.className = 'name';
        name.textContent = t.text;
        row.appendChild(mark);
        row.appendChild(name);
        if (t.category) {
          var cat = document.createElement('span');
          cat.className = 'category-badge';
          cat.textContent = t.category;
          row.appendChild(cat);
        }
        if (t.track) {
          row.appendChild(buildAmountControl(t, dKey, function(n){
            setAmount(t, dKey, n);
            save();
            render();
            renderCalendar();
          }));
        } else {
          row.addEventListener('click', function(){
            setDone(t, dKey, !done);
            save();
            render();
            renderCalendar();
          });
        }
        calDayList.appendChild(row);
      });
    }
    if (singleTask) {
      addGroup('', active, isDoneOn(singleTask, dKey));
    } else {
      addGroup('Completed', doneList, true);
      addGroup('Not completed', notDone, false);
      if (active.length) {
        var hint = document.createElement('div');
        hint.className = 'day-hint';
        hint.textContent = 'Tap a discipline to change it.';
        calDayList.appendChild(hint);
      }
    }
  }

  // ---- Drinks tab ----
  drinkCalPrev.addEventListener('click', function(){ changeDrinkMonth(-1); });
  drinkCalNext.addEventListener('click', function(){ changeDrinkMonth(1); });

  drinkTypeSelect.addEventListener('change', function(){
    drinkOtherInput.style.display = drinkTypeSelect.value === 'other' ? '' : 'none';
  });

  drinkAddBtn.addEventListener('click', function(){
    var type = drinkTypeSelect.value;
    var qty = parseInt(drinkQtyInput.value, 10);
    var cost = parseFloat(drinkCostInput.value);
    if (!qty || qty < 1) { showDrinkError('Enter how many.'); return; }
    if (isNaN(cost) || cost < 0) cost = 0;
    var label = '';
    if (type === 'other') {
      label = drinkOtherInput.value.trim();
      if (!label) { showDrinkError('Say what it was.'); return; }
    }
    var dKey = drinkCalState.selectedDate;
    if (!state.drinks) state.drinks = {};
    if (!state.drinks[dKey]) state.drinks[dKey] = [];
    state.drinks[dKey].push({ id: uid(), type: type, label: label, qty: qty, cost: Math.round(cost * 100) / 100 });
    drinkQtyInput.value = 1;
    drinkCostInput.value = '';
    drinkOtherInput.value = '';
    drinkFormError.classList.remove('show');
    save();
    renderDrinksTab();
  });

  function showDrinkError(msg) {
    drinkFormError.textContent = msg;
    drinkFormError.classList.add('show');
  }

  function drinkEntriesOnDate(dateKey) {
    return (state.drinks && state.drinks[dateKey]) || [];
  }

  function drinkUnitsOnDate(dateKey) {
    return drinkEntriesOnDate(dateKey).reduce(function(sum, e){ return sum + (e.qty || 0); }, 0);
  }

  function drinkCostOnDate(dateKey) {
    return drinkEntriesOnDate(dateKey).reduce(function(sum, e){ return sum + (e.cost || 0); }, 0);
  }

  function formatCost(n) {
    return '£' + (Math.round(n * 100) / 100).toFixed(2);
  }

  function onDeleteDrinkEntry(dateKey, entryId) {
    if (!state.drinks || !state.drinks[dateKey]) return;
    state.drinks[dateKey] = state.drinks[dateKey].filter(function(e){ return e.id !== entryId; });
    if (state.drinks[dateKey].length === 0) delete state.drinks[dateKey];
    save();
    renderDrinksTab();
  }

  function changeDrinkMonth(delta) {
    drinkCalState.month += delta;
    if (drinkCalState.month < 0) { drinkCalState.month = 11; drinkCalState.year -= 1; }
    if (drinkCalState.month > 11) { drinkCalState.month = 0; drinkCalState.year += 1; }
    renderDrinksTab();
  }

  function renderDrinksTab() {
    drinkCalMonthLabel.textContent = new Date(drinkCalState.year, drinkCalState.month, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });

    var firstWeekday = (new Date(drinkCalState.year, drinkCalState.month, 1).getDay() + 6) % 7;
    var daysInMonth = new Date(drinkCalState.year, drinkCalState.month + 1, 0).getDate();
    var todayKey = todayStr();

    drinkCalGrid.innerHTML = '';
    for (var p = 0; p < firstWeekday; p++) {
      var pad = document.createElement('div');
      pad.className = 'cal-day pad';
      drinkCalGrid.appendChild(pad);
    }

    var monthUnits = 0, monthCost = 0;
    var daysDrank = 0, daysElapsed = 0; // elapsed = days of this month up to and including today
    var typeTotals = {};

    for (var day = 1; day <= daysInMonth; day++) {
      var dKey = drinkCalState.year + '-' + String(drinkCalState.month+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
      var entries = drinkEntriesOnDate(dKey);
      var units = drinkUnitsOnDate(dKey);
      if (dKey <= todayKey) daysElapsed++;
      if (entries.length > 0) daysDrank++;
      monthUnits += units;
      monthCost += drinkCostOnDate(dKey);
      entries.forEach(function(e){
        typeTotals[e.type] = (typeTotals[e.type] || 0) + (e.qty || 0);
      });

      var cell = document.createElement('div');
      var isFuture = dKey > todayKey;
      var hasDrinks = entries.length > 0;
      cell.className = 'cal-day' +
        (hasDrinks ? ' has-drinks' : '') +
        (dKey === todayKey ? ' today' : '') +
        (dKey === drinkCalState.selectedDate ? ' selected' : '') +
        (isFuture ? ' future' : '');
      cell.textContent = day;
      if (hasDrinks) {
        var badge = document.createElement('span');
        badge.className = 'cal-day-badge';
        badge.textContent = units;
        cell.appendChild(badge);
      }
      if (!isFuture) {
        cell.addEventListener('click', function(clickedKey){
          return function(){ drinkCalState.selectedDate = clickedKey; renderDrinksTab(); };
        }(dKey));
      }
      drinkCalGrid.appendChild(cell);
    }

    var typeOrder = ['pint', 'bottle', 'can', 'shot', 'other'];
    var breakdownHtml = typeOrder.filter(function(k){ return typeTotals[k]; }).map(function(k){
      return '<span class="tier-count-chip">' + DRINK_TYPES[k] + ': ' + typeTotals[k] + '</span>';
    }).join('');

    var summaryHtml = '<div class="drink-month-summary">' +
      '<div class="drink-stat"><b>' + monthUnits + '</b><span>drinks this month</span></div>' +
      '<div class="drink-stat"><b>' + formatCost(monthCost) + '</b><span>spent this month</span></div>' +
      '</div>' +
      '<div class="drink-month-summary">' +
      '<div class="drink-stat"><b>' + daysDrank + '</b><span>day' + (daysDrank === 1 ? '' : 's') + ' drank</span></div>' +
      '<div class="drink-stat"><b class="dry">' + (daysElapsed - daysDrank) + '</b><span>day' + (daysElapsed - daysDrank === 1 ? '' : 's') + ' dry' +
        (daysElapsed ? ' (of ' + daysElapsed + ')' : '') + '</span></div>' +
      '</div>';
    if (breakdownHtml) summaryHtml += '<div class="tier-count-row">' + breakdownHtml + '</div>';
    drinkMonthSummary.innerHTML = summaryHtml;

    renderDrinkDayPanel();
  }

  function renderDrinkDayPanel() {
    var dKey = drinkCalState.selectedDate;
    var isToday = dKey === todayStr();
    drinkDayPanelTitle.textContent = (isToday ? 'Today — ' : '') +
      dateFromKey(dKey).toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });

    var entries = drinkEntriesOnDate(dKey);
    drinkEntryList.innerHTML = '';
    if (entries.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.innerHTML = '<span class="glyph">🍺</span>Nothing logged for this day.';
      drinkEntryList.appendChild(empty);
    } else {
      entries.forEach(function(e){
        var li = document.createElement('li');
        li.className = 'drink-entry';

        var text = document.createElement('div');
        text.className = 'drink-entry-text';
        var label = e.type === 'other' ? (e.label || 'Other') : DRINK_TYPES[e.type];
        text.textContent = e.qty + 'x ' + label;

        var cost = document.createElement('div');
        cost.className = 'drink-entry-cost';
        cost.textContent = formatCost(e.cost || 0);

        var del = document.createElement('button');
        del.className = 'drink-del';
        del.setAttribute('aria-label', 'Delete entry');
        del.textContent = '×';
        del.addEventListener('click', function(){ onDeleteDrinkEntry(dKey, e.id); });

        li.appendChild(text);
        li.appendChild(cost);
        li.appendChild(del);
        drinkEntryList.appendChild(li);
      });
    }
  }


  // ---- Backup & restore / import ----
  var restoreBtn = document.getElementById('restoreBtn');
  var exportBtn = document.getElementById('exportBtn');
  var restoreList = document.getElementById('restoreList');
  var importText = document.getElementById('importText');
  var importBtn = document.getElementById('importBtn');
  var importMsg = document.getElementById('importMsg');

  function showImportMsg(msg) {
    importMsg.textContent = msg;
    importMsg.classList.add('show');
  }

  function restoreFromSnapshot(snapshot) {
    if (!window.confirm('Replace everything currently in the app with this backup?')) return;
    backupLocalState(state);
    state = migrateState(JSON.parse(JSON.stringify(snapshot)));
    localWasFresh = false; // an explicit restore is allowed to sync up
    save();
    refreshAllViews();
    restoreList.innerHTML = '';
    showImportMsg('Restored.');
  }

  function renderRestoreList(items) {
    restoreList.innerHTML = '';
    if (items.length === 0) {
      var none = document.createElement('div');
      none.className = 'day-hint';
      none.textContent = 'No backups found yet. A cloud backup is saved automatically once a day from now on.';
      restoreList.appendChild(none);
      return;
    }
    items.forEach(function(item){
      var row = document.createElement('div');
      row.className = 'drink-entry';
      var text = document.createElement('div');
      text.className = 'drink-entry-text';
      text.textContent = item.label + ' · ' + item.state.tasks.length + ' disciplines';
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'backup-btn small';
      btn.textContent = 'Restore';
      btn.addEventListener('click', function(){ restoreFromSnapshot(item.state); });
      row.appendChild(text);
      row.appendChild(btn);
      restoreList.appendChild(row);
    });
  }

  restoreBtn.addEventListener('click', function(){
    importMsg.classList.remove('show');
    restoreList.innerHTML = '<div class="day-hint">Looking for backups…</div>';
    var cloudItems = [];
    var phoneItems = [];
    try {
      var lb = JSON.parse(localStorage.getItem(BACKUP_KEY) || '[]');
      if (Array.isArray(lb)) lb.forEach(function(b){
        if (b && b.state && Array.isArray(b.state.tasks) && b.state.tasks.length) {
          phoneItems.push({ label: 'This phone · ' + new Date(b.savedAt).toLocaleString(), state: b.state });
        }
      });
    } catch (e) {}
    function finish() { renderRestoreList(cloudItems.concat(phoneItems)); }
    if (cloudReady && db) {
      db.collection(SYNC_DOC.collection).get().then(function(snap){
        var found = [];
        snap.forEach(function(d){
          if (d.id.indexOf(BACKUP_DOC_PREFIX) !== 0) return;
          var data = d.data();
          if (data && Array.isArray(data.tasks) && data.tasks.length) {
            found.push({ id: d.id, label: 'Cloud · ' + d.id.slice(BACKUP_DOC_PREFIX.length), state: data });
          }
        });
        found.sort(function(a, b){ return a.id < b.id ? 1 : -1; });
        cloudItems = found;
        finish();
      }).catch(finish);
    } else {
      finish();
    }
  });

  exportBtn.addEventListener('click', function(){
    var text = JSON.stringify(state);
    function fallback() {
      importText.value = text;
      importText.focus();
      importText.select();
      showImportMsg('Copy didn\'t work automatically. The data is in the box below: select all and copy it.');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function(){
        showImportMsg('Copied. Paste it somewhere safe (e.g. a note to yourself).');
      }).catch(fallback);
    } else {
      fallback();
    }
  });

  // Accepts {text, category} (anything else in the item is ignored, so older
  // exports with XP / tiers / counters still import as plain disciplines).
  function normalizeImportedTask(t) {
    if (!t || typeof t.text !== 'string' || !t.text.trim()) return null;
    var h = {};
    if (t.history && typeof t.history === 'object') {
      Object.keys(t.history).forEach(function(k){
        var v = t.history[k];
        if (typeof v === 'number' && v > 0) h[k] = v; else if (v) h[k] = true;
      });
    }
    var track = t.track === true || t.type === 'counter';
    return {
      id: uid(), type: 'simple', text: t.text.trim(),
      category: typeof t.category === 'string' ? t.category : '',
      track: track, unit: track && typeof t.unit === 'string' ? t.unit : '',
      createdDate: todayStr(), history: h
    };
  }

  importBtn.addEventListener('click', function(){
    importMsg.classList.remove('show');
    var txt = importText.value.trim();
    if (!txt) { showImportMsg('Paste some data first.'); return; }
    var data;
    try { data = JSON.parse(txt); } catch (e) { showImportMsg('That doesn\'t look like valid data.'); return; }

    if (Array.isArray(data)) {
      var added = 0;
      data.forEach(function(raw){
        var t = normalizeImportedTask(raw);
        if (t) { state.tasks.push(t); added++; }
      });
      if (!added) { showImportMsg('No valid disciplines found in that list.'); return; }
      localWasFresh = false;
      save();
      importText.value = '';
      refreshAllViews();
      showImportMsg('Added ' + added + ' disciplines.');
    } else if (data && Array.isArray(data.tasks)) {
      restoreFromSnapshot(data);
      importText.value = '';
    } else {
      showImportMsg('Expected either a full export or a list of disciplines.');
    }
  });

  render();
  startCloudSync();
})();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* offline-first still works without it */ });
    });
  }
</script>
