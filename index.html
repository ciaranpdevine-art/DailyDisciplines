<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Disciplines</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12132A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Disciplines">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12132A;
    --bg-2: #191B38;
    --surface: #1F2247;
    --surface-2: #262A57;
    --line: #33376B;
    --text: #F1EFE8;
    --text-dim: #9598C4;
    --coral: #FF6B4E;
    --coral-dim: #7A3B2C;
    --lime: #C7F464;
    --lime-dim: #4A5A2A;
    --violet: #9B8CFF;
    --font-head: 'Space Grotesk', system-ui, sans-serif;
    --font-body: 'Inter', system-ui, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-tap-highlight-color: transparent;
  }
  body {
    background:
      radial-gradient(circle at 15% 0%, rgba(155,140,255,0.16), transparent 45%),
      radial-gradient(circle at 90% 10%, rgba(255,107,78,0.14), transparent 40%),
      var(--bg);
    min-height: 100%;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 480px;
    padding: 22px 18px 40px;
    position: relative;
  }

  /* Header */
  .top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .top-title h1 {
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 26px;
    margin: 0 0 2px;
    letter-spacing: -0.01em;
  }
  .top-title p {
    margin: 0;
    color: var(--text-dim);
    font-size: 13.5px;
  }
  .streak {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 12px 7px 10px;
    flex-shrink: 0;
  }
  .streak .flame {
    font-size: 16px;
    filter: grayscale(1) opacity(0.5);
    transition: filter .25s ease, transform .25s ease;
  }
  .streak.active .flame {
    filter: grayscale(0) opacity(1);
    animation: flicker 1.6s ease-in-out infinite;
  }
  @keyframes flicker {
    0%, 100% { transform: scale(1) rotate(0deg); }
    50% { transform: scale(1.08) rotate(-3deg); }
  }
  .streak b {
    font-family: var(--font-head);
    font-size: 15px;
  }
  .streak span.label {
    color: var(--text-dim);
    font-size: 11.5px;
  }

  /* XP bar */
  .xp-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 14px 16px;
    margin-bottom: 20px;
  }
  .xp-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 9px;
  }
  .xp-level {
    font-family: var(--font-head);
    font-weight: 600;
    font-size: 14.5px;
    color: var(--lime);
  }
  .xp-count {
    font-size: 12px;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }
  .xp-track {
    height: 9px;
    border-radius: 999px;
    background: var(--bg-2);
    overflow: hidden;
    position: relative;
  }
  .xp-fill {
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--lime), #8fe0a8);
    width: 0%;
    transition: width .5s cubic-bezier(.34,1.56,.64,1);
  }
  .xp-today {
    margin-top: 10px;
    text-align: right;
    font-size: 12px;
    color: var(--text-dim);
  }
  .xp-today .val {
    font-family: var(--font-head);
    font-weight: 600;
    color: var(--text-dim);
  }
  .xp-today .val.positive { color: var(--lime); }
  .xp-today .val.negative { color: #FF8A8A; }

  /* Date navigator */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 16px;
  }
  .date-nav-btn {
    width: 34px;
    height: 34px;
    flex-shrink: 0;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text);
    font-size: 17px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .date-nav-btn:active { transform: scale(0.92); }
  .date-nav-btn:disabled { opacity: 0.25; cursor: default; }
  .date-nav-btn:disabled:active { transform: none; }
  .date-nav-label {
    flex: 1;
    text-align: center;
    background: none;
    border: none;
    color: var(--text);
    font-family: var(--font-head);
    font-weight: 600;
    font-size: 15px;
    cursor: default;
    padding: 6px 8px;
  }
  .date-nav-label.is-past {
    color: var(--violet);
    cursor: pointer;
    text-decoration: underline;
    text-decoration-color: rgba(155,140,255,0.4);
  }

  /* Progress ring row */
  .today-progress {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
    color: var(--text-dim);
    font-size: 13px;
  }
  .today-progress .bar {
    flex: 1;
    height: 6px;
    border-radius: 999px;
    background: var(--surface-2);
    overflow: hidden;
  }
  .today-progress .bar-fill {
    height: 100%;
    background: var(--coral);
    width: 0%;
    border-radius: 999px;
    transition: width .4s ease;
  }
  .today-filter {
    display: flex;
    gap: 7px;
    margin-bottom: 16px;
  }
  .filter-btn {
    flex: 1;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text-dim);
    font-family: var(--font-head);
    font-weight: 600;
    font-size: 12.5px;
    padding: 8px 0;
    border-radius: 10px;
    cursor: pointer;
    transition: all .15s ease;
  }
  .filter-btn.active { border-color: transparent; background: var(--surface-2); color: var(--text); }
  .filter-btn.filter-good.active { background: rgba(199,244,100,0.16); color: var(--lime); }
  .filter-btn.filter-bad.active { background: rgba(255,90,90,0.16); color: #FF8A8A; }

  /* Add task */
  .add-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 12px;
    margin-bottom: 22px;
  }
  .add-row {
    display: flex;
    gap: 8px;
  }
  .add-row input {
    flex: 1;
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 15px;
    padding: 11px 13px;
    outline: none;
    min-width: 0;
  }
  .add-row input::placeholder { color: var(--text-dim); }
  .add-row input:focus { border-color: var(--violet); }
  .add-btn {
    flex-shrink: 0;
    width: 42px;
    height: 42px;
    border-radius: 12px;
    border: none;
    background: var(--coral);
    color: #1a0e0a;
    font-size: 22px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform .15s ease;
  }
  .add-btn:active { transform: scale(0.9); }
  .size-row {
    display: flex;
    gap: 7px;
    margin-top: 10px;
  }
  .size-pill {
    flex: 1;
    text-align: center;
    padding: 7px 0;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text-dim);
    font-family: var(--font-head);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s ease;
  }
  .size-pill.selected {
    border-color: transparent;
  }
  .size-pill[data-size="5"].selected { background: rgba(199,244,100,0.16); color: var(--lime); }
  .size-pill[data-size="10"].selected { background: rgba(255,107,78,0.16); color: var(--coral); }
  .size-pill[data-size="20"].selected { background: rgba(155,140,255,0.18); color: var(--violet); }
  .type-row {
    display: flex;
    gap: 7px;
    margin-top: 8px;
  }
  .type-btn {
    flex: 1;
    text-align: center;
    padding: 8px 6px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text-dim);
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all .15s ease;
  }
  .type-btn.selected { border-color: transparent; }
  .type-btn[data-sign="1"].selected { background: rgba(199,244,100,0.16); color: var(--lime); }
  .type-btn[data-sign="-1"].selected { background: rgba(255,90,90,0.16); color: #FF8A8A; }

  /* Creation type toggle */
  .create-type-row {
    display: flex;
    gap: 7px;
    margin-bottom: 14px;
  }
  .create-btn {
    flex: 1;
    text-align: center;
    padding: 10px 0;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text-dim);
    font-family: var(--font-head);
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    transition: all .15s ease;
  }
  .create-btn.selected {
    border-color: transparent;
    background: rgba(155,140,255,0.18);
    color: var(--violet);
  }

  /* Group creation form */
  .group-name-input {
    width: 100%;
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 15px;
    padding: 11px 13px;
    outline: none;
    margin-bottom: 12px;
  }
  .group-name-input::placeholder { color: var(--text-dim); }
  .group-name-input:focus { border-color: var(--violet); }
  .tier-rows {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 10px;
  }
  .tier-row {
    display: flex;
    gap: 7px;
    align-items: center;
  }
  .tier-row input.tier-label-input {
    flex: 1;
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    padding: 9px 11px;
    outline: none;
    min-width: 0;
  }
  .tier-row input.tier-xp-input {
    width: 68px;
    flex-shrink: 0;
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    font-family: var(--font-head);
    font-size: 14px;
    padding: 9px 6px;
    outline: none;
    text-align: center;
  }
  .tier-row input::placeholder { color: var(--text-dim); }
  .tier-row input:focus { border-color: var(--violet); }
  .tier-remove-btn {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border: none;
    background: none;
    color: var(--text-dim);
    font-size: 17px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .add-tier-btn {
    width: 100%;
    padding: 9px 0;
    border-radius: 10px;
    border: 1px dashed var(--line);
    background: transparent;
    color: var(--text-dim);
    font-family: var(--font-head);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 12px;
  }
  .create-group-btn {
    width: 100%;
    padding: 12px 0;
    border-radius: 12px;
    border: none;
    background: var(--violet);
    color: #1a0e2a;
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  .create-group-btn:active { transform: scale(0.98); }
  .form-error {
    color: #FF8A8A;
    font-size: 12px;
    text-align: center;
    margin-top: 9px;
    display: none;
  }
  .form-error.show { display: block; }

  /* Habit group cards (Today tab) */
  .group-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 20px;
  }
  .group-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
  }
  .group-card.negative {
    border-color: rgba(255,90,90,0.35);
  }
  .group-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 11px;
    gap: 8px;
  }
  .group-name {
    font-family: var(--font-head);
    font-weight: 600;
    font-size: 15px;
    min-width: 0;
  }
  .group-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .task-xp.neg { color: #FF8A8A; }
  .tier-chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .tier-chip {
    border: 1px solid var(--line);
    background: var(--bg-2);
    color: var(--text-dim);
    font-family: var(--font-body);
    font-size: 12.5px;
    font-weight: 500;
    padding: 7px 11px;
    border-radius: 10px;
    cursor: pointer;
    transition: all .15s ease;
  }
  .tier-chip:active { transform: scale(0.94); }
  .tier-chip.positive { border-color: rgba(199,244,100,0.35); color: var(--lime); }
  .tier-chip.negative { border-color: rgba(255,90,90,0.35); color: #FF8A8A; }
  .tier-chip.selected.positive { background: rgba(199,244,100,0.18); border-color: var(--lime); color: var(--lime); }
  .tier-chip.selected.negative { background: rgba(255,90,90,0.18); border-color: #FF8A8A; color: #FF8A8A; }
  .group-dot { background: var(--violet); }
  .counter-dot { background: var(--coral); }
  .task.negative .group-dot { background: #FF8A8A; }

  /* Counter cards (Today tab) */
  .counter-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 9px;
  }
  .counter-btn {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--bg-2);
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .counter-btn:active { transform: scale(0.9); }
  .counter-input {
    flex: 1;
    text-align: center;
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    font-family: var(--font-head);
    font-size: 16px;
    padding: 8px 0;
    outline: none;
  }
  .counter-input::-webkit-outer-spin-button,
  .counter-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .counter-input:focus { border-color: var(--violet); }
  .counter-quick-row {
    display: flex;
    gap: 7px;
    margin-bottom: 8px;
  }
  .counter-quick-btn {
    flex: 1;
    padding: 6px 0;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text-dim);
    font-family: var(--font-head);
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .counter-quick-btn:active { transform: scale(0.92); }
  .counter-unit-label {
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
  }

  /* Counter creation form */
  .counter-sentence-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 10px 0;
    flex-wrap: wrap;
  }
  .counter-sentence-text {
    color: var(--text-dim);
    font-size: 14px;
    font-family: var(--font-body);
    flex-shrink: 0;
  }
  .counter-rate-input {
    width: 56px;
    flex-shrink: 0;
    text-align: center;
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    font-family: var(--font-head);
    font-size: 14px;
    padding: 9px 4px;
    outline: none;
  }
  .counter-unit-input {
    flex: 1;
    min-width: 90px;
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    padding: 9px 11px;
    outline: none;
  }
  .counter-rate-input:focus, .counter-unit-input:focus { border-color: var(--violet); }
  .counter-rate-input::placeholder, .counter-unit-input::placeholder { color: var(--text-dim); }

  /* Calendar tier breakdown */
  .tier-count-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    margin-top: 10px;
  }
  .tier-count-chip {
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 11.5px;
    color: var(--text-dim);
  }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 4px;
    margin-bottom: 20px;
  }
  .tab-btn {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-family: var(--font-head);
    font-weight: 600;
    font-size: 13.5px;
    padding: 9px 0;
    border-radius: 10px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .tab-btn.active {
    background: var(--surface-2);
    color: var(--text);
  }

  /* Calendar */
  .cal-select-wrap {
    margin-bottom: 16px;
  }
  .cal-select {
    width: 100%;
    appearance: none;
    -webkit-appearance: none;
    background: var(--surface) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="12" height="8" viewBox="0 0 12 8"><path d="M1 1L6 6L11 1" stroke="%239598C4" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>') no-repeat right 14px center;
    border: 1px solid var(--line);
    border-radius: 14px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 15px;
    font-weight: 500;
    padding: 13px 38px 13px 15px;
    cursor: pointer;
  }
  .cal-select:focus { border-color: var(--violet); outline: none; }
  .cal-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 16px;
  }
  .cal-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .cal-nav span {
    font-family: var(--font-head);
    font-weight: 600;
    font-size: 15px;
  }
  .cal-nav button {
    width: 30px;
    height: 30px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: var(--bg-2);
    color: var(--text);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cal-nav button:active { transform: scale(0.92); }
  .cal-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    margin-bottom: 6px;
  }
  .cal-weekdays span {
    text-align: center;
    font-size: 11px;
    color: var(--text-dim);
    font-family: var(--font-head);
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .cal-day {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 9px;
    font-size: 12.5px;
    color: var(--text-dim);
    position: relative;
  }
  .cal-day.pad { visibility: hidden; }
  .cal-day.today { box-shadow: inset 0 0 0 1.5px var(--violet); }
  .cal-day.done {
    background: var(--lime);
    color: #12132A;
    font-weight: 700;
  }
  .cal-day:not(.pad):not(.future) {
    cursor: pointer;
    transition: transform .12s ease, background .15s ease;
  }
  .cal-day:not(.pad):not(.future):active { transform: scale(0.88); }
  .cal-day.future {
    opacity: 0.3;
  }
  .cal-summary .cal-hint {
    display: inline-block;
    margin-top: 6px;
    font-size: 11.5px;
    color: var(--text-dim);

    color: var(--lime);
    font-family: var(--font-head);

  .section-label {

    font-weight: 600;

    flex-direction: column;

    display: flex;
    align-items: center;

    padding: 12px 12px;

    from { opacity: 0; transform: translateY(6px); }

    opacity: 0.55;
    background: var(--bg-2);
  }
  .check {
    width: 25px;
    height: 25px;
    border-radius: 50%;
    border: 2px solid var(--line);
    flex-shrink: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .15s ease, border-color .2s ease, background .2s ease;
    background: transparent;

  .check:active { transform: scale(0.85); }
  .check svg {
    width: 13px;
    height: 13px;
    opacity: 0;
    transform: scale(0.5);

  .task.done .check {
    background: var(--lime);
    border-color: var(--lime);

  .task.done .check svg { opacity: 1; transform: scale(1); }

    background: #FF8A8A;
    border-color: #FF8A8A;
  }

    line-height: 1.35;

    text-decoration: line-through;
    text-decoration-color: var(--text-dim);
    color: var(--text-dim);
  }
  .task-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .task-xp {
    font-family: var(--font-head);
    font-size: 11px;

    width: 9px;

    font-size: 11.5px;

  .confetti-bit {

  }

  @media (prefers-reduced-motion: reduce) {

<script>
(function(){
  var STORAGE_KEY = 'daily_disciplines_state_v1';
  var state = null;

  // ---- Firebase (optional cross-device sync) ----
  // Fill these in with your own project's values from the Firebase console
  // (Project settings → General → Your apps → SDK setup and configuration).
  // Left as-is, the app just runs on local storage as before.
  var firebaseConfig = {
    apiKey: "AIzaSyAq9_EmffcklWKSYl1k8dr-Hg1FrzMoihc",
    authDomain: "daily-disciplines-b7819.firebaseapp.com",
    projectId: "daily-disciplines-b7819",
    storageBucket: "daily-disciplines-b7819.firebasestorage.app",
    messagingSenderId: "796837430246",
    appId: "1:796837430246:web:417eac9535c0905b4f8c27"
  };
  var SYNC_DOC = { collection: 'daily-disciplines', doc: 'my-data' };
  var db = null;
  var cloudReady = false;
  var suppressNextSnapshot = false;

  function initCloud() {
    try {
      if (typeof firebase === 'undefined') return; // SDK didn't load (offline, or blocked in this preview)
      if (!firebaseConfig.apiKey || firebaseConfig.apiKey.indexOf('YOUR_') === 0) return; // not configured yet
      firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
      try { db.enablePersistence({ synchronizeTabs: true }); } catch (e) { /* fine without it */ }
      cloudReady = true;
    } catch (e) {
      cloudReady = false;
    }
  }

  function startCloudSync() {
    if (!cloudReady || !db) return;
    var ref = db.collection(SYNC_DOC.collection).doc(SYNC_DOC.doc);
    ref.get().then(function(snap){
      if (snap.exists) {
        applyRemoteState(snap.data());
      } else {
        ref.set(state).catch(function(){});
      }
      ref.onSnapshot(function(snap2){
        if (suppressNextSnapshot) { suppressNextSnapshot = false; return; }
        if (snap2.exists) applyRemoteState(snap2.data());
      });
    }).catch(function(){ /* offline — local storage keeps the app working */ });
  }

  function migrateState(parsed) {
    parsed.tasks.forEach(function(t){
      if (!t.history || typeof t.history !== 'object') t.history = {};
      if (t.done) t.history[todayStr()] = true; // backfill for pre-history saves
      // a group tagged "bad" must have every tier negative, even ones
      // created before this rule existed
      if (t.type === 'group' && (t.sign || 1) < 0 && Array.isArray(t.tiers)) {
        t.tiers.forEach(function(tier){ tier.xp = -Math.abs(tier.xp); });
      }
    });
    if (typeof parsed.updatedAt !== 'number') parsed.updatedAt = Date.now();
    return parsed;
  }

  function applyRemoteState(remote) {
    if (!remote || !Array.isArray(remote.tasks)) return;

    // If our local copy is newer than what the cloud has, don't lose it —
    // push it up instead of pulling the older remote copy down.
    if (state && typeof state.updatedAt === 'number' && typeof remote.updatedAt === 'number'
        && remote.updatedAt < state.updatedAt) {
      save();
      return;
    }

    // Safety net either way: keep the last few states we're about to replace,
    // so a bad sync is recoverable rather than silently gone.
    backupLocalState(state);

    state = migrateState(remote);
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    rolloverIfNewDay();
    render();
  }

  var BACKUP_KEY = 'daily_disciplines_backups_v1';
  function backupLocalState(prevState) {
    try {
      if (!prevState || !Array.isArray(prevState.tasks) || prevState.tasks.length === 0) return;
      var raw = localStorage.getItem(BACKUP_KEY);
      var backups = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(backups)) backups = [];
      backups.unshift({ savedAt: Date.now(), state: prevState });
      backups = backups.slice(0, 5);
      localStorage.setItem(BACKUP_KEY, JSON.stringify(backups));
    } catch (e) { /* backups are best-effort, never block on them */ }
  }

  function todayStr(d) {
    d = d || new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  function defaultState() {
    return {
      tasks: [],           // {id, text, size, done, history: {date: true}}
      totalXp: 0,
      lastActiveDate: todayStr(),
      celebratedToday: false,
      updatedAt: Date.now()
    };
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      var parsed = JSON.parse(raw);
      if (!parsed || !Array.isArray(parsed.tasks)) return defaultState();
      return migrateState(parsed);
    } catch (e) {
      return defaultState();
    }
  }

  function save() {
    state.updatedAt = Date.now();
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch (e) { /* storage unavailable — continue in-memory */ }
    if (cloudReady && db) {
      suppressNextSnapshot = true;
      db.collection(SYNC_DOC.collection).doc(SYNC_DOC.doc).set(state)
        .catch(function(){ /* offline — Firestore queues and retries automatically */ });
    }
  }

  function rolloverIfNewDay() {
    var today = todayStr();
    if (state.lastActiveDate === today) return;

    // "done" for the new day reflects whatever history already says (in case it
    // was edited ahead of time); streaks themselves are always computed live.
    state.tasks.forEach(function(t){
      t.done = !!(t.history && t.history[today]);
    });

    state.lastActiveDate = today;
    state.celebratedToday = false;
    save();
  }

  function computeStreak(task) {
    var history = task.history || {};
    var d = new Date();
    var streak = 0;
    if (history[todayStr(d)]) streak = 1;
    d.setDate(d.getDate() - 1);
    while (history[todayStr(d)]) {
      streak++;
      d.setDate(d.getDate() - 1);
    }
    return streak;
  }

  function dateFromKey(key) {
    var p = key.split('-');
    return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
  }

  function isDoneOnDate(t, date) {
    return !!(t.history && t.history[date]);
  }

  function isDoneToday(t) {
    return isDoneOnDate(t, todayStr());
  }

  function counterXp(t, qty) {
    var rate = t.unitsPerXp || 1;
    var units = Math.floor(qty / rate);
    return (t.sign || 1) * units;
  }

  function xpOnDate(t, date) {
    if (t.type === 'group') {
      var tierId = t.history && t.history[date];
      if (!tierId) return 0;
      var tier = t.tiers.find(function(x){ return x.id === tierId; });
      return tier ? tier.xp : 0;
    }
    if (t.type === 'counter') {
      var qty = (t.history && t.history[date]) || 0;
      return counterXp(t, qty);
    }
    var val = t.history && t.history[date];
    return val ? t.size : 0;
  }

  function xpToday(t) {
    return xpOnDate(t, todayStr());
  }

  state = load();
  rolloverIfNewDay();
  initCloud();

  // ---- DOM refs ----
  var dateLabel = document.getElementById('dateLabel');
  var streakBox = document.getElementById('streakBox');
  var streakCount = document.getElementById('streakCount');
  var levelLabel = document.getElementById('levelLabel');
  var xpLabel = document.getElementById('xpLabel');
  var xpFill = document.getElementById('xpFill');
  var xpTodayLabel = document.getElementById('xpTodayLabel');
  var xpTodayVal = document.getElementById('xpTodayVal');
  var progressLabel = document.getElementById('progressLabel');
  var todayFill = document.getElementById('todayFill');
  var listsWrap = document.getElementById('listsWrap');
  var dateNavRow = document.getElementById('dateNavRow');
  var datePrevBtn = document.getElementById('datePrevBtn');
  var dateNextBtn = document.getElementById('dateNextBtn');
  var dateNavLabel = document.getElementById('dateNavLabel');
  var viewedDate = todayStr();

  function changeDay(delta) {
    var d = dateFromKey(viewedDate);
    d.setDate(d.getDate() + delta);
    var newKey = todayStr(d);
    if (newKey > todayStr()) return; // no browsing into the future
    viewedDate = newKey;
    render();
  }

  datePrevBtn.addEventListener('click', function(){ changeDay(-1); });
  dateNextBtn.addEventListener('click', function(){ changeDay(1); });
  dateNavLabel.addEventListener('click', function(){
    if (viewedDate !== todayStr()) { viewedDate = todayStr(); render(); }
  });

  var todayFilterRow = document.getElementById('todayFilterRow');
  var todayFilter = 'all';
  todayFilterRow.addEventListener('click', function(e){
    var btn = e.target.closest('.filter-btn');
    if (!btn) return;
    todayFilter = btn.getAttribute('data-filter');
    Array.prototype.forEach.call(todayFilterRow.children, function(c){ c.classList.remove('active'); });
    btn.classList.add('active');
    render();
  });
  var taskInput = document.getElementById('taskInput');
  var addBtn = document.getElementById('addBtn');
  var sizeRow = document.getElementById('sizeRow');
  var createTypeRow = document.getElementById('createTypeRow');
  var simpleForm = document.getElementById('simpleForm');
  var groupForm = document.getElementById('groupForm');
  var groupNameInput = document.getElementById('groupNameInput');
  var tierRowsWrap = document.getElementById('tierRows');
  var addTierBtn = document.getElementById('addTierBtn');
  var createGroupBtn = document.getElementById('createGroupBtn');
  var groupFormError = document.getElementById('groupFormError');
  var counterForm = document.getElementById('counterForm');
  var counterNameInput = document.getElementById('counterNameInput');
  var counterUnitInput = document.getElementById('counterUnitInput');
  var counterRateInput = document.getElementById('counterRateInput');
  var counterSignRow = document.getElementById('counterSignRow');
  var groupSignRow = document.getElementById('groupSignRow');
  var createCounterBtn = document.getElementById('createCounterBtn');
  var counterFormError = document.getElementById('counterFormError');
  var celebrate = document.getElementById('celebrate');
  var celebrateSub = document.getElementById('celebrateSub');
  var tabTodayBtn = document.getElementById('tabTodayBtn');
  var tabAddBtn = document.getElementById('tabAddBtn');
  var tabCalendarBtn = document.getElementById('tabCalendarBtn');
  var todayView = document.getElementById('todayView');
  var addView = document.getElementById('addView');
  var calendarView = document.getElementById('calendarView');
  var manageListWrap = document.getElementById('manageListWrap');
  var calTaskSelect = document.getElementById('calTaskSelect');
  var calGrid = document.getElementById('calGrid');
  var calMonthLabel = document.getElementById('calMonthLabel');
  var calSummary = document.getElementById('calSummary');
  var calPrev = document.getElementById('calPrev');
  var calNext = document.getElementById('calNext');

  var now = new Date();
  var calState = { year: now.getFullYear(), month: now.getMonth(), selectedTaskId: null };

  var TABS = {
    today: { btn: null, view: null },
    add: { btn: null, view: null },
    calendar: { btn: null, view: null }
  };

  TABS.add.btn = tabAddBtn; TABS.add.view = addView;
  TABS.calendar.btn = tabCalendarBtn; TABS.calendar.view = calendarView;

  tabTodayBtn.addEventListener('click', function(){ switchTab('today'); });

  function switchTab(tab) {
    Object.keys(TABS).forEach(function(key){
      var active = key === tab;
      TABS[key].btn.classList.toggle('active', active);
      TABS[key].view.style.display = active ? '' : 'none';
    });
    if (tab === 'add') renderManageList();
    if (tab === 'calendar') renderCalendar();
  }

  calPrev.addEventListener('click', function(){ changeMonth(-1); });
  calNext.addEventListener('click', function(){ changeMonth(1); });
  calTaskSelect.addEventListener('change', function(){
    calState.selectedTaskId = calTaskSelect.value;
    renderCalendar();
  });

  function changeMonth(delta) {
    calState.month += delta;
    if (calState.month < 0) { calState.month = 11; calState.year -= 1; }
    if (calState.month > 11) { calState.month = 0; calState.year += 1; }
    renderCalendar();
  }

  function renderCalendar() {
    if (state.tasks.length === 0) {
      calTaskSelect.innerHTML = '';
      calGrid.innerHTML = '';
      calMonthLabel.textContent = new Date(calState.year, calState.month, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
      calSummary.textContent = 'Add a discipline in the Add tab to start tracking it here.';
      return;
    }
    if (!calState.selectedTaskId || !state.tasks.some(function(t){ return t.id === calState.selectedTaskId; })) {
      calState.selectedTaskId = state.tasks[0].id;
    }
    calTaskSelect.innerHTML = '';
    state.tasks.forEach(function(t){
      var opt = document.createElement('option');
      opt.value = t.id;
      opt.textContent = t.text + (t.type === 'group' ? ' (group)' : t.type === 'counter' ? ' (counter)' : '');
      if (t.id === calState.selectedTaskId) opt.selected = true;
      calTaskSelect.appendChild(opt);
    });

    var task = state.tasks.find(function(t){ return t.id === calState.selectedTaskId; });
    var history = (task && task.history) || {};
    var isGroup = task.type === 'group';
    var isCounter = task.type === 'counter';

    calMonthLabel.textContent = new Date(calState.year, calState.month, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });

    var firstWeekday = new Date(calState.year, calState.month, 1).getDay();
    var daysInMonth = new Date(calState.year, calState.month + 1, 0).getDate();
    var todayKey = todayStr();

    calGrid.innerHTML = '';
    for (var p = 0; p < firstWeekday; p++) {
      var pad = document.createElement('div');
      pad.className = 'cal-day pad';
      calGrid.appendChild(pad);
    }
    var completions = 0;
    var tierCounts = {};
    if (isGroup) task.tiers.forEach(function(t){ tierCounts[t.id] = 0; });
    var monthQty = 0;
    var monthXp = 0;

    for (var day = 1; day <= daysInMonth; day++) {
      var dKey = calState.year + '-' + String(calState.month+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
      var cell = document.createElement('div');
      var cellVal = history[dKey];
      var isDone = !!cellVal;
      var isFuture = dKey > todayKey;
      if (isDone) {
        completions++;
        if (isGroup && tierCounts.hasOwnProperty(cellVal)) tierCounts[cellVal]++;
        if (isCounter) { monthQty += cellVal; monthXp += counterXp(task, cellVal); }
      }
      cell.className = 'cal-day' + (isDone ? ' done' : '') + (dKey === todayKey ? ' today' : '') + (isFuture ? ' future' : '');
      cell.textContent = day;
      if (!isFuture && !isCounter) {
        cell.addEventListener('click', function(clickedKey, clickedTask){
          return function(){ onCalendarDayToggle(clickedTask, clickedKey); };
        }(dKey, task));
      }
      calGrid.appendChild(cell);
    }

    var summaryHtml = '<b>' + completions + '</b> ' +
      ((isGroup || isCounter) ? ('day' + (completions === 1 ? '' : 's') + ' logged') : ('completion' + (completions === 1 ? '' : 's'))) +
      ' for "' + escapeHtml(task.text) + '" this month';

    if (isGroup) {
      var breakdown = task.tiers.map(function(t){
        return '<span class="tier-count-chip">' + escapeHtml(t.label) + ': ' + tierCounts[t.id] + '</span>';
      }).join('');
      summaryHtml += '<div class="tier-count-row">' + breakdown + '</div>';
    }

    if (isCounter) {
      summaryHtml += '<div class="tier-count-row">' +
        '<span class="tier-count-chip">' + monthQty + ' ' + escapeHtml(task.unit) + '</span>' +
        '<span class="tier-count-chip">' + (monthXp > 0 ? '+' : '') + monthXp + ' XP</span>' +
        '</div>';
    }

    summaryHtml += '<br><span class="cal-hint">' +
      (isGroup ? 'Tap a day to cycle through tiers.' : isCounter ? 'Edit counts from the Today tab — calendar is read-only for counters.' : 'Tap any day to mark it done or undone.') +
      '</span>';

    calSummary.innerHTML = summaryHtml;
  }

  function onCalendarDayToggle(task, dateKey) {
    if (dateKey > todayStr()) return; // no marking the future
    if (!task.history) task.history = {};

    if (task.type === 'group') {
      var ids = task.tiers.map(function(t){ return t.id; });
      var currentId = task.history[dateKey] || null;
      var idx = currentId ? ids.indexOf(currentId) : -1;
      var nextIdx = idx + 1;
      var prevTier = currentId ? task.tiers.find(function(t){ return t.id === currentId; }) : null;
      var newTierId = nextIdx < ids.length ? ids[nextIdx] : null;
      var newTier = newTierId ? task.tiers.find(function(t){ return t.id === newTierId; }) : null;
      var delta = (newTier ? newTier.xp : 0) - (prevTier ? prevTier.xp : 0);
      state.totalXp = Math.max(0, state.totalXp + delta);
      if (newTierId) task.history[dateKey] = newTierId; else delete task.history[dateKey];
    } else {
      var wasDone = !!task.history[dateKey];
      if (wasDone) {
        delete task.history[dateKey];
      } else {
        task.history[dateKey] = true;
      }
      state.totalXp = Math.max(0, state.totalXp + (wasDone ? -task.size : task.size));
      if (dateKey === todayStr()) {
        task.done = !wasDone;
      }
    }

    save();
    render();
    renderCalendar();
  }

  var selectedGroupSign = 1;

  createGroupBtn.addEventListener('click', function(){
    groupFormError.classList.remove('show');

      groupFormError.textContent = 'Give the group a name first.';

      tiers = tiers.map(function(t){ return { id: t.id, label: t.label, xp: -Math.abs(t.xp) }; });
    }

  createCounterBtn.addEventListener('click', function(){

    counterRateInput.value = '1';

  dateLabel.textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function levelFromXp(xp) {
    var LEVEL_XP = 150;
    var level = Math.floor(xp / LEVEL_XP) + 1;
    var into = xp % LEVEL_XP;
    return { level: level, into: into, need: LEVEL_XP };
  }

  function render() {
    var isToday = viewedDate === todayStr();
    dateNavLabel.textContent = isToday ? 'Today' : dateFromKey(viewedDate).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
    dateNavLabel.classList.toggle('is-past', !isToday);
    dateNextBtn.disabled = isToday;

    var bestStreak = state.tasks.reduce(function(max, t){ return Math.max(max, computeStreak(t)); }, 0);
    streakCount.textContent = bestStreak;
    streakBox.classList.toggle('active', bestStreak > 0);

    var lv = levelFromXp(state.totalXp);
    levelLabel.textContent = 'Level ' + lv.level;
    xpLabel.textContent = lv.into + ' / ' + lv.need + ' XP';
    xpFill.style.width = (lv.into / lv.need * 100) + '%';

    xpTodayLabel.textContent = isToday ? 'Today' : dateNavLabel.textContent;
    var viewedNet = state.tasks.reduce(function(sum, t){ return sum + xpOnDate(t, viewedDate); }, 0);
    xpTodayVal.textContent = (viewedNet > 0 ? '+' : '') + viewedNet + ' XP';
    xpTodayVal.classList.toggle('positive', viewedNet > 0);
    xpTodayVal.classList.toggle('negative', viewedNet < 0);

    var groups = state.tasks.filter(function(t){ return t.type === 'group'; });
    var counters = state.tasks.filter(function(t){ return t.type === 'counter'; });
    var simpleTasks = state.tasks.filter(function(t){ return t.type !== 'group' && t.type !== 'counter'; });

    function matchesFilter(t){
      if (todayFilter === 'all') return true;
      var positive = (t.type === 'counter' || t.type === 'group') ? ((t.sign || 1) > 0) : (t.size > 0);
      return todayFilter === 'good' ? positive : !positive;
    }

    var filteredTasks = simpleTasks.filter(matchesFilter);
    var filteredCounters = counters.filter(matchesFilter);
    var filteredGroups = groups.filter(matchesFilter);

    var countBase = filteredTasks.concat(filteredCounters).concat(filteredGroups);
    var total = countBase.length;
    var done = countBase.filter(function(t){ return isDoneOnDate(t, viewedDate); }).length;
    var verb = todayFilter === 'bad' ? 'logged' : 'cleared';
    progressLabel.textContent = total === 0 ? 'No disciplines yet' : (done + ' of ' + total + ' ' + verb);
    todayFill.style.width = total === 0 ? '0%' : (done/total*100) + '%';

    listsWrap.innerHTML = '';

    if (state.tasks.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.innerHTML = '<span class="glyph">🎯</span>No disciplines yet.<br>Add one you want to build daily — or just today.';
      listsWrap.appendChild(empty);
      return;
    }

    if (filteredGroups.length) {
      listsWrap.appendChild(sectionLabel('Habit groups'));
      var gWrap = document.createElement('div');
      gWrap.className = 'group-list';
      filteredGroups.forEach(function(g){ gWrap.appendChild(groupCard(g)); });
      listsWrap.appendChild(gWrap);
    }

    if (filteredCounters.length) {
      listsWrap.appendChild(sectionLabel('Counters'));
      var cWrap = document.createElement('div');
      cWrap.className = 'group-list';
      filteredCounters.forEach(function(c){ cWrap.appendChild(counterCard(c)); });
      listsWrap.appendChild(cWrap);
    }

    if (filteredTasks.length === 0) {
      var emptyFiltered = document.createElement('div');
      emptyFiltered.className = 'empty';
      emptyFiltered.innerHTML = todayFilter === 'good'
        ? '<span class="glyph">🌱</span>No good single tasks yet.'
        : todayFilter === 'bad'
          ? '<span class="glyph">🚫</span>No slip tasks tracked yet.'
          : '<span class="glyph">✅</span>No single tasks yet.';
      listsWrap.appendChild(emptyFiltered);
      return;
    }

    var sortedFiltered = filteredTasks.slice().sort(function(a, b){ return b.size - a.size; });
    var active = sortedFiltered.filter(function(t){ return !isDoneOnDate(t, viewedDate); });
    var cleared = sortedFiltered.filter(function(t){ return isDoneOnDate(t, viewedDate); });

    if (active.length) {
      listsWrap.appendChild(sectionLabel(isToday ? 'Today' : 'Active'));
      listsWrap.appendChild(taskList(active));
    }
    if (cleared.length) {
      listsWrap.appendChild(sectionLabel('Cleared'));
      listsWrap.appendChild(taskList(cleared));
    }
  }

  function sectionLabel(text) {
    var d = document.createElement('div');
    d.className = 'section-label';
    d.textContent = text;
    return d;
  }

  function sizeIcon(t) {
    return svgCheck();
  }

  function svgCheck() {
    return '<svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2.5 8.5L6 12L13.5 3.5" stroke="#12132A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  function taskList(items) {
    var ul = document.createElement('ul');
    ul.className = 'task-list';
    items.forEach(function(t){
      var done = isDoneOnDate(t, viewedDate);
      var li = document.createElement('li');
      li.className = 'task' + (done ? ' done' : '') + (t.size < 0 ? ' negative' : '');
      li.setAttribute('data-size', t.size);
      li.setAttribute('data-id', t.id);

      var check = document.createElement('button');
      check.className = 'check';
      check.setAttribute('aria-label', done ? 'Mark not done' : 'Mark done');
      check.innerHTML = svgCheck();
      check.addEventListener('click', function(ev){ onToggle(t.id, ev); });

      var text = document.createElement('div');
      text.className = 'task-text';
      text.textContent = t.text;

      var meta = document.createElement('div');
      meta.className = 'task-meta';
      var streakVal = computeStreak(t);
      var streakHtml = streakVal > 0
        ? '<span class="task-streak">🔥' + streakVal + '</span>'
        : '';
      meta.innerHTML = streakHtml + '<span class="task-xp">' + (t.size > 0 ? '+' : '') + t.size + 'xp</span>';

      li.appendChild(check);
      li.appendChild(text);
      li.appendChild(meta);
      ul.appendChild(li);
    });
    return ul;
  }

  function groupCard(g) {
    var card = document.createElement('div');
    card.className = 'group-card' + ((g.sign || 1) < 0 ? ' negative' : '');

    var header = document.createElement('div');
    header.className = 'group-header';

    var name = document.createElement('div');
    name.className = 'group-name';
    name.textContent = g.text;

    var meta = document.createElement('div');
    meta.className = 'group-meta';
    var streakVal = computeStreak(g);
    var streakHtml = streakVal > 0 ? '<span class="task-streak">🔥' + streakVal + '</span>' : '';
    var todayTierId = g.history && g.history[viewedDate];
    var todayTier = todayTierId ? g.tiers.find(function(t){ return t.id === todayTierId; }) : null;
    var xpHtml = '<span class="task-xp' + (todayTier && todayTier.xp < 0 ? ' neg' : '') + '">' +
      (todayTier ? ((todayTier.xp > 0 ? '+' : '') + todayTier.xp + 'xp') : '—') + '</span>';
    meta.innerHTML = streakHtml + xpHtml;

    header.appendChild(name);

    var chipRow = document.createElement('div');
    chipRow.className = 'tier-chip-row';
    g.tiers.forEach(function(tier){
      var chip = document.createElement('button');
      var isSelected = todayTierId === tier.id;
      chip.className = 'tier-chip' + (isSelected ? ' selected' : '') + (tier.xp < 0 ? ' negative' : ' positive');
      chip.textContent = tier.label + ' · ' + (tier.xp > 0 ? '+' : '') + tier.xp + 'xp';
      chip.addEventListener('click', function(ev){ onGroupTierToggle(g, tier.id, ev); });
      chipRow.appendChild(chip);
    });

    card.appendChild(header);
    card.appendChild(chipRow);
    return card;
  }

  function onGroupTierToggle(group, tierId, ev) {
    var date = viewedDate;
    if (!group.history) group.history = {};
    var prevTierId = group.history[date];
    var deselecting = prevTierId === tierId;
    var prevTier = prevTierId ? group.tiers.find(function(t){ return t.id === prevTierId; }) : null;
    var newTier = deselecting ? null : group.tiers.find(function(t){ return t.id === tierId; });
    var delta = (newTier ? newTier.xp : 0) - (prevTier ? prevTier.xp : 0);
    state.totalXp = Math.max(0, state.totalXp + delta);
    if (deselecting) delete group.history[date];
    else group.history[date] = tierId;
    save();
    if (newTier && ev && ev.currentTarget) floatXp(newTier.xp, ev.currentTarget);
    render();
    if (newTier && date === todayStr()) maybeCelebrate();
  }

  function counterCard(t) {
    var card = document.createElement('div');
    card.className = 'group-card';

    var header = document.createElement('div');
    header.className = 'group-header';

    var name = document.createElement('div');
    name.className = 'group-name';
    name.textContent = t.text;

    var meta = document.createElement('div');
    meta.className = 'group-meta';
    var streakVal = computeStreak(t);
    var streakHtml = streakVal > 0 ? '<span class="task-streak">🔥' + streakVal + '</span>' : '';
    var todayXp = xpOnDate(t, viewedDate);
    var xpHtml = '<span class="task-xp' + (todayXp < 0 ? ' neg' : '') + '">' + (todayXp > 0 ? '+' : '') + todayXp + 'xp</span>';
    meta.innerHTML = streakHtml + xpHtml;

    header.appendChild(name);
    header.appendChild(meta);

    var todayQty = (t.history && t.history[viewedDate]) || 0;

    var row = document.createElement('div');
    row.className = 'counter-row';

    var minusBtn = document.createElement('button');
    minusBtn.className = 'counter-btn';
    minusBtn.type = 'button';
    minusBtn.textContent = '−';
    minusBtn.setAttribute('aria-label', 'Decrease ' + t.unit);
    minusBtn.addEventListener('click', function(){ onCounterChange(t, todayQty - 1); });

    var input = document.createElement('input');
    input.type = 'number';
    input.className = 'counter-input';
    input.min = '0';
    input.value = todayQty;
    input.addEventListener('change', function(){
      var v = parseInt(input.value, 10);
      onCounterChange(t, isNaN(v) ? 0 : v);
    });

    var plusBtn = document.createElement('button');
    plusBtn.className = 'counter-btn';
    plusBtn.type = 'button';
    plusBtn.textContent = '+';
    plusBtn.setAttribute('aria-label', 'Increase ' + t.unit);
    plusBtn.addEventListener('click', function(){ onCounterChange(t, todayQty + 1); });

    row.appendChild(minusBtn);
    row.appendChild(input);
    row.appendChild(plusBtn);

    var quickRow = document.createElement('div');
    quickRow.className = 'counter-quick-row';
    [5, 10].forEach(function(step){
      var qb = document.createElement('button');
      qb.type = 'button';
      qb.className = 'counter-quick-btn';
      qb.textContent = '+' + step;
      qb.addEventListener('click', function(){ onCounterChange(t, todayQty + step); });
      quickRow.appendChild(qb);
    });

    card.appendChild(header);
    card.appendChild(row);
    card.appendChild(quickRow);
    return card;
  }

  function onCounterChange(t, newQuantity) {
    newQuantity = Math.max(0, Math.floor(newQuantity) || 0);
    var date = viewedDate;
    if (!t.history) t.history = {};
    var oldQuantity = t.history[date] || 0;
    var oldXp = counterXp(t, oldQuantity);
    var newXp = counterXp(t, newQuantity);
    var delta = newXp - oldXp;
    state.totalXp = Math.max(0, state.totalXp + delta);
    if (newQuantity > 0) t.history[date] = newQuantity; else delete t.history[date];
    save();
    render();
    if (newXp > oldXp && date === todayStr()) maybeCelebrate();
  }

  function renderManageList() {
    manageListWrap.innerHTML = '';
    if (state.tasks.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.innerHTML = '<span class="glyph">✏️</span>Nothing added yet.<br>Use the form above to create your first discipline.';
      manageListWrap.appendChild(empty);
      return;
    }
    var ul = document.createElement('ul');
    ul.className = 'task-list';
    state.tasks.forEach(function(t){
      var li = document.createElement('li');
      var isGroup = t.type === 'group';
      var isCounter = t.type === 'counter';
      var isNegative = (isCounter || isGroup) ? (t.sign || 1) < 0 : t.size < 0;
      li.className = 'task' + (isNegative ? ' negative' : '');

      var dot = document.createElement('span');
      dot.className = 'manage-dot' + (isGroup ? ' group-dot' : '') + (isCounter ? ' counter-dot' : '');

      var text = document.createElement('div');
      text.className = 'task-text';
      text.textContent = t.text;

      var meta = document.createElement('div');
      meta.className = 'task-meta';
      if (isGroup) {
        meta.innerHTML = '<span class="task-xp">' + t.tiers.length + ' tiers</span>';
      } else if (isCounter) {
        meta.innerHTML = '<span class="task-xp">' + (t.unitsPerXp || 1) + ' ' + escapeHtml(t.unit) + ' = ' + (t.sign > 0 ? '+' : '−') + '1xp</span>';
      } else {
        meta.innerHTML = '<span class="task-xp">' + (t.size > 0 ? '+' : '') + t.size + 'xp</span>';
      }

      var del = document.createElement('button');
      del.className = 'task-del';
      del.setAttribute('aria-label', 'Delete discipline');
      del.textContent = '×';
      del.addEventListener('click', function(){ onDelete(t.id); });

      li.appendChild(dot);
      li.appendChild(text);
      li.appendChild(meta);
      li.appendChild(del);
      ul.appendChild(li);
    });
    manageListWrap.appendChild(ul);
  }

  function floatXp(amount, originEl) {
    var rect = originEl.getBoundingClientRect();
    var f = document.createElement('div');
    f.className = 'float-xp';
    f.textContent = (amount > 0 ? '+' : '') + amount + ' XP';
    f.style.left = (rect.left + rect.width/2 - 20) + 'px';
    f.style.top = (rect.top - 6) + 'px';
    document.body.appendChild(f);
    setTimeout(function(){ f.remove(); }, 1000);
  }

  function maybeCelebrate() {
    if (state.tasks.length === 0) return;
    var allDone = state.tasks.every(function(t){ return isDoneToday(t); });
    if (allDone && !state.celebratedToday) {
      state.celebratedToday = true;
      save();
      celebrateSub.textContent = 'All ' + state.tasks.length + ' disciplines done. Streaks tick up tomorrow.';
      launchCelebration();
    }
  }

  function launchCelebration() {
    var colors = ['#FF6B4E', '#C7F464', '#9B8CFF', '#F1EFE8'];
    // clear old bits
    var old = celebrate.querySelectorAll('.confetti-bit');
    old.forEach(function(o){ o.remove(); });
    for (var i = 0; i < 26; i++) {
      var bit = document.createElement('div');
      bit.className = 'confetti-bit';
      var angle = Math.random() * Math.PI * 2;
      var dist = 90 + Math.random() * 140;
      var dx = Math.cos(angle) * dist;
      var dy = Math.sin(angle) * dist - 40;
      bit.style.background = colors[i % colors.length];
      bit.style.animation = 'none';
      bit.animate([
        { transform: 'translate(-50%,-50%) rotate(0deg)', opacity: 1 },
        { transform: 'translate(' + dx + 'px,' + dy + 'px) rotate(' + (Math.random()*400-200) + 'deg)', opacity: 0 }
      ], { duration: 1000 + Math.random()*500, easing: 'cubic-bezier(.2,.8,.3,1)', fill: 'forwards' });
      celebrate.appendChild(bit);
    }
    celebrate.classList.remove('show');
    void celebrate.offsetWidth;
    celebrate.classList.add('show');
  }

  function onToggle(id, ev) {
    var t = state.tasks.find(function(x){ return x.id === id; });
    if (!t) return;
    var date = viewedDate;
    if (!t.history) t.history = {};
    var wasDone = !!t.history[date];
    var nowDone = !wasDone;
    if (nowDone) { t.history[date] = true; } else { delete t.history[date]; }
    if (date === todayStr()) t.done = nowDone; // keep the convenience flag in sync for today
    state.totalXp = Math.max(0, state.totalXp + (nowDone ? t.size : -t.size));
    save();
    if (nowDone) {
      var checkEl = ev.currentTarget;
      floatXp(t.size, checkEl);
    }
    render();
    if (nowDone && date === todayStr()) maybeCelebrate();
  }

  function onDelete(id) {
    state.tasks = state.tasks.filter(function(x){ return x.id !== id; });
    save();
    render();
    renderManageList();
  }

  function addTask() {
    var text = taskInput.value.trim();
    if (!text) return;
    state.tasks.unshift({ id: uid(), type: 'simple', text: text, size: selectedSize * selectedSign, done: false, history: {} });
    state.celebratedToday = false;
    taskInput.value = '';
    save();
    render();
    renderManageList();
    taskInput.focus();
  }

  addBtn.addEventListener('click', addTask);
  taskInput.addEventListener('keydown', function(e){
    if (e.key === 'Enter') addTask();
  });

  render();
  startCloudSync();
})();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* offline-first still works without it */ });
    });
  }
</script>
